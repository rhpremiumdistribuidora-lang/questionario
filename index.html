<title>Premium Cargos e Remuneração</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">

<style>
  /* Layout concept: a slim green internal header with progress + a map
     drawer sits above a single working card per step; the home view
     swaps the header for a full institutional hero. One engine serves
     two audiences (gestor / RH) as separate step tracks plus a reports view. */
  :root{
    --bg:#F3F6F3; --surface:#FFFFFF; --surface-2:#E9EFE9; --border:#DAE3DA;
    --ink:#1B211C; --ink-soft:#5B645C; --ink-faint:#8B948B;
    --green:#1E7A4C; --green-dark:#135736; --green-ink:#FFFFFF; --green-tint:#E2F1E8;
    --gestor:#4A5A78; --gestor-tint:#E7EAF2;
    --warn:#A6651F; --warn-tint:#F5EAD9;
    --pending:#A33636; --pending-tint:#F6E1DF;
    --good:#1E7A4C; --good-tint:#E2F1E8;
    --shell:#0F4529; --shell-ink:#FFFFFF; --shell-soft:rgba(255,255,255,.72); --shell-active:rgba(255,255,255,.14);
    --font-display:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14160F0D; --bg:#15180F; --surface:#1B1F17; --surface-2:#212620; --border:#333B32;
      --ink:#E9EEE8; --ink-soft:#AEB8AC; --ink-faint:#7B847A;
      --green:#49B07C; --green-dark:#6FCB9B; --green-ink:#0D140F; --green-tint:#1B2E22;
      --gestor:#8C9AC0; --gestor-tint:#222838;
      --warn:#DDA055; --warn-tint:#332511;
      --pending:#E2746B; --pending-tint:#32201E;
      --good:#49B07C; --good-tint:#1B2E22;
      --shell:#12291C; --shell-ink:#E9EEE8; --shell-soft:rgba(233,238,232,.68); --shell-active:rgba(255,255,255,.10);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15180F; --surface:#1B1F17; --surface-2:#212620; --border:#333B32;
    --ink:#E9EEE8; --ink-soft:#AEB8AC; --ink-faint:#7B847A;
    --green:#49B07C; --green-dark:#6FCB9B; --green-ink:#0D140F; --green-tint:#1B2E22;
    --gestor:#8C9AC0; --gestor-tint:#222838;
    --warn:#DDA055; --warn-tint:#332511;
    --pending:#E2746B; --pending-tint:#32201E;
    --good:#49B07C; --good-tint:#1B2E22;
    --shell:#12291C; --shell-ink:#E9EEE8; --shell-soft:rgba(233,238,232,.68); --shell-active:rgba(255,255,255,.10);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-body);
    padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));}
  h1,h2,h3{font-family:var(--font-display); margin:0; text-wrap:balance;}
  p{margin:0;}
  .mono{font-family:var(--font-mono);}
  .wrap{max-width:880px; margin:0 auto;}
  button{font:inherit; cursor:pointer;}
  input,textarea,select{font:inherit; color:inherit;}
  [hidden]{display:none!important;}

  /* ---------- home hero ---------- */
  .hero-wrap{padding-block:18px 0;}
  .hero-top{display:flex; justify-content:space-between; align-items:center; padding-block:4px 14px;}
  .brandmark{display:flex; align-items:center; gap:8px; font-weight:800; font-size:13px; letter-spacing:.03em; color:var(--green-dark);}
  .brandmark .sq{width:10px; height:10px; background:var(--green); border-radius:2px;}
  .hero-img-slot{
    position:relative; border-radius:18px; overflow:hidden; border:1px solid var(--border);
    background:var(--surface-2); min-height:220px; display:flex; align-items:center; justify-content:center;
  }
  .hero-img-slot img{width:100%; display:block;}
  .hero-placeholder{text-align:center; padding:34px 22px; max-width:440px;}
  .hero-placeholder .ic{width:40px; height:40px; margin:0 auto 14px; color:var(--green); opacity:.75;}
  .hero-placeholder h3{font-size:15px; margin-bottom:8px;}
  .hero-placeholder p{font-size:12.8px; color:var(--ink-soft); line-height:1.6;}
  .hero-band{background:var(--green); color:var(--green-ink); padding:9px 16px; font-size:12px; text-align:center; letter-spacing:.02em;}
  .hero-body{padding:30px 6px 10px; text-align:center;}
  .hero-eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; color:var(--green-dark); text-transform:uppercase;}
  .hero-title{font-size:25px; font-weight:800; margin-top:10px; letter-spacing:-0.01em; line-height:1.25;}
  .hero-sub{font-size:14.5px; color:var(--ink-soft); margin-top:12px; max-width:52ch; margin-inline:auto; line-height:1.6;}
  .hero-note{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-top:22px; font-size:13px; color:var(--ink-soft); text-align:left; line-height:1.6; max-width:560px; margin-inline:auto;}
  .hero-cta{margin-top:24px; display:flex; flex-direction:column; align-items:center; gap:10px;}
  .btn-cta{background:var(--green); color:var(--green-ink); border:none; border-radius:11px; padding:15px 30px; font-size:15px; font-weight:700; box-shadow:0 10px 24px -12px rgba(30,122,76,.55);}
  .btn-cta-ghost{background:none; border:none; color:var(--gestor); font-size:12.8px; text-decoration:underline; text-underline-offset:3px;}
  .hero-foot{margin-top:40px; padding-block:18px; border-top:1px solid var(--border); text-align:center; font-size:11px; color:var(--ink-faint); font-family:var(--font-mono);}

  /* ---------- internal header ---------- */
  header.mast{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--green); color:var(--green-ink); padding-block:12px 10px;}
  .mast-inner{max-width:880px; margin:0 auto;}
  .mast-row{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .mast-left{display:flex; align-items:center; gap:9px; min-width:0;}
  .mast-home-btn{background:rgba(255,255,255,.14); border:none; color:var(--green-ink); width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex:none;}
  .mast-titles{min-width:0;}
  .mast-title{font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mast-sub{font-size:10.5px; opacity:.82; margin-top:1px;}
  .role-pill{font-family:var(--font-mono); font-size:10px; background:rgba(255,255,255,.16); padding:3px 9px; border-radius:999px; flex:none;}
  .save-pill{font-size:10px; opacity:.78; font-family:var(--font-mono); display:flex; align-items:center; gap:5px; white-space:nowrap; margin-top:2px;}
  .save-dot{width:5px; height:5px; border-radius:50%; background:#fff; flex:none;}
  .progress-track{height:4px; border-radius:3px; background:rgba(255,255,255,.22); margin-top:10px; overflow:hidden;}
  .progress-fill{height:100%; background:#fff; border-radius:3px; transition:width .3s ease;}
  .step-meta{display:flex; justify-content:space-between; align-items:center; margin-top:8px; gap:10px; flex-wrap:wrap;}
  .step-count{font-family:var(--font-mono); font-size:10.5px; opacity:.85;}
  .step-label-btn{display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.14); border:none; border-radius:999px; padding:5px 12px; font-size:12px; color:var(--green-ink);}
  .step-label-btn svg{width:10px; height:10px; opacity:.8;}

  .map-panel{position:sticky; top:calc(env(safe-area-inset-top,0px) + 92px); z-index:29; background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:12px; margin-top:10px; padding:12px; display:none; max-height:62vh; overflow:auto; box-shadow:0 10px 30px -12px rgba(0,0,0,.3);}
  .map-panel.open{display:block;}
  .map-section-title{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin:14px 0 6px; font-family:var(--font-mono);}
  .map-section-title:first-child{margin-top:2px;}
  .map-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:6px;}
  .map-item{display:flex; align-items:center; gap:9px; text-align:left; background:none; border:1px solid transparent; border-radius:8px; padding:7px 9px; color:var(--ink);}
  .map-item:hover{background:var(--surface-2);}
  .map-item.current{border-color:var(--green); background:var(--green-tint);}
  .map-item .num{width:20px; height:20px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:10px; background:var(--surface-2); color:var(--ink-soft);}
  .map-item.done .num{background:var(--good-tint); color:var(--good);}
  .map-item .txt{display:flex; flex-direction:column; min-width:0;}
  .map-item .txt b{font-size:12px; font-weight:600;}

  /* ---------- main ---------- */
  main{padding-block:20px 140px;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px 22px 26px;}
  .card + .card{margin-top:16px;}
  .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--green-dark); display:flex; align-items:center; gap:8px;}
  .eyebrow.is-rh{color:var(--gestor);}
  .step-title{font-size:22px; margin-top:4px; font-weight:800; letter-spacing:-0.01em;}
  .step-intro{font-size:13.6px; color:var(--ink-soft); margin-top:9px; max-width:64ch; line-height:1.6;}
  .section-title{font-size:14.5px; font-weight:700; margin:24px 0 2px;}
  .section-title:first-of-type{margin-top:20px;}
  .section-note{font-size:12.3px; color:var(--ink-soft); margin-bottom:10px; line-height:1.55;}

  .field{margin-top:16px;}
  .field-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px;}
  .field label.lbl{font-size:13.3px; font-weight:600; line-height:1.4;}
  .field .req{color:var(--pending); font-weight:700;}
  .field .opt-tag{font-size:10.5px; color:var(--ink-faint); font-weight:400;}
  .field .help{font-size:11.8px; color:var(--ink-faint); margin-top:4px; line-height:1.5;}
  .unknown-toggle{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-faint); white-space:nowrap; flex:none; padding-top:1px;}
  .unknown-toggle input{accent-color:var(--green);}
  .input,.textarea,.select{width:100%; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:9px 11px; font-size:13.3px; color:var(--ink);}
  .input:focus,.textarea:focus,.select:focus{outline:none; border-color:var(--green);}
  .textarea{resize:vertical; min-height:70px; line-height:1.5;}
  .field.is-unknown .input,.field.is-unknown .textarea,.field.is-unknown .select{background:var(--surface-2); color:var(--ink-faint);}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  @media (max-width:640px){ .grid-2,.grid-3{grid-template-columns:1fr;} }

  .qn{border-top:1px solid var(--border); padding-top:18px; margin-top:18px;}
  .qn:first-child{border-top:none; padding-top:0; margin-top:0;}
  .qn-num{display:inline-flex; align-items:center; justify-content:center; width:21px; height:21px; border-radius:50%; background:var(--surface-2); color:var(--ink-soft); font-family:var(--font-mono); font-size:10.5px; margin-right:7px; flex:none;}
  .qn-head{display:flex; align-items:flex-start; gap:0;}
  .qn-title{font-size:14px; font-weight:700; line-height:1.4;}
  .qn-help{font-size:12px; color:var(--ink-faint); margin:6px 0 0 28px; line-height:1.5;}

  .choice-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .choice{display:flex; align-items:center; gap:7px; border:1px solid var(--border); border-radius:10px; padding:8px 13px; font-size:12.8px; background:var(--bg);}
  .choice input{accent-color:var(--green); flex:none;}
  .choice.wide{width:100%;}
  .choice-single input[type=radio]{accent-color:var(--green);}

  .group-card{border:1px solid var(--border); border-radius:12px; margin-top:12px; overflow:hidden;}
  .group-head{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:var(--surface-2); cursor:pointer;}
  .group-head h4{font-size:13px; font-weight:700;}
  .group-count{font-family:var(--font-mono); font-size:10.5px; color:var(--green-dark); background:var(--green-tint); padding:2px 8px; border-radius:999px;}
  .group-chevron{width:10px; height:10px; transition:transform .15s; flex:none;}
  .group-card.open .group-chevron{transform:rotate(180deg);}
  .group-body{padding:12px 14px 14px; display:none;}
  .group-card.open .group-body{display:block;}
  .group-item{display:flex; align-items:flex-start; gap:9px; padding:7px 0; font-size:12.8px; border-top:1px dashed var(--border);}
  .group-item:first-child{border-top:none;}
  .group-item input{margin-top:2px; accent-color:var(--green); flex:none;}

  .stat-row{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px;}
  .stat-tile{flex:1; min-width:112px; background:var(--surface-2); border-radius:10px; padding:10px 12px;}
  .stat-tile .k{font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em;}
  .stat-tile .v{font-family:var(--font-mono); font-size:15px; margin-top:2px;}

  .factor{border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:14px;}
  .factor-head{display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap;}
  .factor-head h4{font-size:14px; font-weight:700;}
  .factor-weight-edit{display:flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:11.5px; color:var(--gestor);}
  .factor-weight-edit input{width:52px; background:var(--gestor-tint); border:1px solid var(--border); border-radius:6px; padding:3px 6px; text-align:right;}
  .factor-anchors{font-size:11.8px; color:var(--ink-soft); margin-top:5px; line-height:1.5;}
  .scale5{display:flex; gap:7px; margin-top:12px;}
  .scale5 label{flex:1; text-align:center;}
  .scale5 input{display:none;}
  .scale5 .dot{border:1px solid var(--border); border-radius:9px; padding:9px 0; font-family:var(--font-mono); font-size:13px; color:var(--ink-soft); display:block;}
  .scale5 input:checked + .dot{background:var(--gestor); border-color:var(--gestor); color:#fff; font-weight:600;}
  .weight-total{margin-top:12px; font-size:12px; font-family:var(--font-mono); padding:8px 12px; border-radius:9px;}
  .weight-total.ok{background:var(--good-tint); color:var(--good);}
  .weight-total.bad{background:var(--pending-tint); color:var(--pending);}
  .score-total{margin-top:18px; border:1px solid var(--gestor); background:var(--gestor-tint); border-radius:12px; padding:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  .score-total .v{font-family:var(--font-mono); font-size:24px; color:var(--gestor);}
  .score-total .k{font-size:12.3px; color:var(--ink);}

  .matrix-table,.data-table{width:100%; border-collapse:collapse; font-size:12.6px; margin-top:6px;}
  .matrix-table th,.matrix-table td,.data-table th,.data-table td{border:1px solid var(--border); padding:8px; vertical-align:top;}
  .matrix-table th,.data-table th{background:var(--surface-2); text-align:left; font-weight:700; font-size:11.2px;}
  .table-scroll{overflow-x:auto; border-radius:10px;}
  .data-table input,.data-table select,.data-table textarea{border:1px solid transparent; background:transparent; width:100%; padding:4px 5px; font-size:12.3px; border-radius:6px;}
  .data-table input:focus,.data-table select:focus,.data-table textarea:focus{outline:none; border-color:var(--green); background:var(--bg);}
  .data-table textarea{min-height:38px; resize:vertical;}
  .row-actions{display:flex; justify-content:flex-end;}
  .icon-btn{background:none; border:1px solid var(--border); border-radius:7px; width:25px; height:25px; display:flex; align-items:center; justify-content:center; color:var(--ink-faint);}
  .icon-btn:hover{color:var(--pending); border-color:var(--pending);}
  .add-row-btn{margin-top:10px; font-size:12.3px; color:var(--green-dark); background:none; border:1px dashed var(--border); border-radius:9px; padding:8px 12px; display:inline-flex; align-items:center; gap:6px;}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:10px; font-family:var(--font-mono); padding:2px 8px; border-radius:999px; white-space:nowrap;}
  .badge-gestor{background:var(--gestor-tint); color:var(--gestor);}
  .badge-rh{background:var(--green-tint); color:var(--green-dark);}
  .badge-estimate{background:var(--warn-tint); color:var(--warn);}
  .badge-pending{background:var(--pending-tint); color:var(--pending);}

  .summary-group{border-top:1px solid var(--border); padding-top:14px; margin-top:14px;}
  .summary-group:first-child{border-top:none; padding-top:0; margin-top:0;}
  .summary-group-head{display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .summary-group-head h4{font-size:13.5px; font-weight:700;}
  .summary-jump{font-size:11.3px; color:var(--green-dark); background:none; border:none; text-decoration:underline; text-underline-offset:2px;}
  .summary-item{display:flex; gap:10px; padding:7px 0; font-size:12.6px; border-top:1px dashed var(--border);}
  .summary-item:first-of-type{border-top:none;}
  .summary-item .q{color:var(--ink-soft); flex:0 0 44%; min-width:0;}
  .summary-item .a{flex:1; min-width:0; white-space:pre-wrap;}
  .summary-item .a.empty{color:var(--ink-faint); font-style:italic;}

  .tabs{display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:18px;}
  .tab-btn{background:none; border:none; padding:10px 16px; font-size:13px; font-weight:600; color:var(--ink-faint); border-bottom:2px solid transparent; margin-bottom:-1px;}
  .tab-btn.active{color:var(--ink); border-bottom-color:var(--green);}

  .report{font-size:13.3px; line-height:1.65;}
  .report h2{font-size:18px; margin-top:26px; padding-top:14px; border-top:2px solid var(--ink); font-weight:800;}
  .report h2:first-child{margin-top:0; padding-top:0; border-top:none;}
  .report h3{font-size:14px; margin-top:16px; color:var(--green-dark); font-weight:700;}
  .report p{margin-top:7px; white-space:pre-wrap;}
  .report ul{margin:7px 0 0; padding-left:19px;}
  .report li{margin-top:4px;}
  .report table{width:100%; border-collapse:collapse; margin-top:9px; font-size:12.3px;}
  .report th,.report td{border:1px solid var(--border); padding:7px 9px; text-align:left; vertical-align:top;}
  .report th{background:var(--surface-2);}
  .report .cover{text-align:center; padding:26px 10px 8px;}
  .report .cover h1{font-size:24px; margin-top:10px; font-weight:800;}
  .report .cover p{color:var(--ink-soft); margin-top:8px;}
  .report .tag-line{margin-top:5px;}

  footer.bar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--border); padding-block:12px calc(12px + env(safe-area-inset-bottom,0px)); padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));}
  .bar-inner{max-width:880px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .btn{border-radius:9px; padding:10px 16px; font-size:13.3px; font-weight:600; border:1px solid var(--border); background:var(--surface); color:var(--ink); display:inline-flex; align-items:center; gap:7px;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn-primary{background:var(--ink); color:var(--bg); border-color:var(--ink);}
  .btn-ghost{background:none;}
  .btn-accent{background:var(--green); color:var(--green-ink); border-color:var(--green);}
  .btn-rh{background:var(--gestor); color:#fff; border-color:var(--gestor);}
  .bar-center{font-size:11.3px; color:var(--ink-faint); font-family:var(--font-mono); text-align:center; flex:1;}

  .copy-toast{position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(8px); z-index:40; background:var(--ink); color:var(--bg); font-size:12.3px; padding:9px 16px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;}
  .copy-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .catalog-group{border:1px solid var(--border); border-radius:12px; padding:14px; margin-top:12px;}
  .catalog-group input.gname{font-size:13.5px; font-weight:700; border:1px solid transparent; background:none; width:100%; padding:4px 2px; border-radius:6px;}
  .catalog-group input.gname:focus{outline:none; border-color:var(--green); background:var(--bg);}
  .catalog-group textarea{width:100%; min-height:130px; margin-top:8px; font-size:12.3px; line-height:1.6; border:1px solid var(--border); border-radius:8px; padding:9px; background:var(--bg);}
  .lead-banner{background:var(--green-tint); border:1px solid var(--border); border-radius:12px; padding:14px 16px; font-size:12.8px; color:var(--green-dark); line-height:1.55; margin-bottom:18px;}

  /* ---------- portal RH: painel / detalhe / nova solicitação ---------- */
  .badge-muted{background:var(--surface-2); color:var(--ink-faint);}
  .link-box{display:flex; gap:10px; align-items:center; background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:9px 11px; font-family:var(--font-mono); font-size:11.8px; word-break:break-all; margin-top:6px;}
  .link-box span{flex:1; min-width:0;}
  .nova-success{text-align:center; padding:26px 16px 10px; background:linear-gradient(180deg, var(--good-tint), transparent); border-radius:16px; margin-bottom:4px;}
  .nova-success-icon{width:46px; height:46px; margin:0 auto 12px; border-radius:50%; background:var(--good); color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:800; box-shadow:0 10px 22px -10px rgba(30,122,76,.55);}
  .nova-success-title{font-size:18px; font-weight:800; letter-spacing:-.01em;}
  .nova-success-sub{font-size:13px; color:var(--ink-soft); margin-top:6px; max-width:48ch; margin-inline:auto; line-height:1.6;}
  /* ===== Shell do painel do RH: barra superior + navegação lateral + área de conteúdo ===== */
  .app-shell{display:flex; min-height:100%; background:var(--bg);}
  .app-side{width:210px; flex:none; background:var(--shell); color:var(--shell-ink); display:flex; flex-direction:column; padding-block:14px; padding-left:max(10px,env(safe-area-inset-left,0px)); padding-right:10px; position:sticky; top:env(safe-area-inset-top,0px); align-self:flex-start; height:100vh; overflow-y:auto;}
  .app-side .side-nav{display:flex; flex-direction:column; gap:4px; margin-top:4px;}
  .side-item{display:flex; align-items:center; gap:10px; width:100%; padding:11px 12px; border-radius:10px; background:none; border:none; color:var(--shell-soft); font-size:13.5px; font-weight:600; text-align:left; cursor:pointer;}
  .side-item:hover{background:rgba(255,255,255,.07); color:var(--shell-ink);}
  .side-item.is-active{background:var(--shell-active); color:var(--shell-ink);}
  .side-item svg{flex:none; opacity:.95;}
  .side-foot{margin-top:auto; padding:16px 12px 4px; font-size:15px; font-weight:700; line-height:1.3; color:rgba(255,255,255,.35);}
  .app-main{flex:1; min-width:0; max-width:100%; display:flex; flex-direction:column;}
  .app-top{background:var(--shell); color:var(--shell-ink); display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding-block:12px; padding-left:18px; padding-right:max(16px,env(safe-area-inset-right,0px));}
  .app-top .top-title{font-size:16px; font-weight:800; line-height:1.2;}
  .app-top .top-sub{font-size:11.5px; color:var(--shell-soft); margin-top:2px;}
  .top-meta{margin-left:auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .top-chip{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--shell-soft); font-family:var(--font-mono);}
  .top-bell{position:relative; display:flex; align-items:center;}
  .top-bell .dot{position:absolute; top:-5px; right:-6px; min-width:16px; height:16px; padding:0 4px; border-radius:999px; background:var(--pending); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; font-family:var(--font-body);}
  .top-user{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600;}
  .top-user .av{width:30px; height:30px; border-radius:999px; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;}
  .app-body{flex:1; min-width:0; max-width:100%; padding-block:22px 34px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));}
  .page-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap;}
  .page-head h2{font-size:23px; font-weight:800; letter-spacing:-.01em;}
  .page-head p{font-size:13.5px; color:var(--ink-soft); margin-top:4px; max-width:60ch;}
  .page-actions{display:flex; gap:10px; flex-wrap:wrap;}

  /* cartões de indicadores */
  .kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:12px; margin-top:20px;}
  .kpi{position:relative; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 30px 14px 14px; cursor:pointer; display:block; width:100%;}
  .kpi:hover{border-color:var(--green); }
  .kpi.is-on{border-color:var(--green); box-shadow:0 0 0 2px var(--green-tint) inset;}
  .kpi .kpi-ic{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;}
  .kpi .kpi-k{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-top:9px; line-height:1.3;}
  .kpi .kpi-v{display:block; font-size:27px; font-weight:800; line-height:1.1; margin-top:4px; font-variant-numeric:tabular-nums; color:var(--ink);}
  .kpi .kpi-c{display:block; font-size:11px; color:var(--ink-faint); margin-top:3px; line-height:1.3;}
  .kpi .kpi-go{position:absolute; right:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint); font-size:15px;}
  .ic-green{background:var(--green-tint); color:var(--green);}
  .ic-warn{background:var(--warn-tint); color:var(--warn);}
  .ic-blue{background:var(--gestor-tint); color:var(--gestor);}
  .ic-gray{background:var(--surface-2); color:var(--ink-soft);}
  .ic-red{background:var(--pending-tint); color:var(--pending);}

  /* faixa de atenção */
  .alerta{display:flex; align-items:center; gap:12px; margin-top:18px; padding:14px 16px; border-radius:12px;
    background:var(--pending-tint); border:1px solid var(--pending); color:var(--pending);}
  .alerta > div > b{display:block; font-size:13.5px; margin-bottom:2px;}
  .alerta p b{color:var(--pending);}
  .alerta p{font-size:12.5px; margin-top:3px; color:var(--ink-soft);}
  .alerta .alerta-go{margin-left:auto; flex:none; background:none; border:none; color:var(--pending); font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;}

  /* barra de filtros */
  .filtros{display:grid; grid-template-columns:minmax(190px,1.7fr) repeat(4,minmax(108px,1fr)) auto; gap:10px; align-items:end;
    margin-top:18px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px;}
  .filtros .f-lab{font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; display:block;}
  .filtros .input, .filtros .select{width:100%;}

  /* tabela */
  .tabela-card{margin-top:16px; background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; min-width:0; max-width:100%;}
  .tabela-head{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border);}
  .tabela-head h3{font-size:14.5px; font-weight:700;}
  .tabela-head .conta{margin-left:auto; font-size:11.5px; color:var(--ink-faint); font-family:var(--font-mono);}
  .tabela-scroll{overflow-x:auto; max-width:100%; min-width:0;}
  table.painel{width:100%; border-collapse:collapse; min-width:1020px;}
  table.painel th:first-child, table.painel td:first-child{padding-left:16px;}
  table.painel th:last-child, table.painel td:last-child{padding-right:16px;}
  table.painel th{font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); font-weight:700; text-align:left; padding:11px 9px; border-bottom:1px solid var(--border); white-space:nowrap;}
  table.painel td{padding:11px 9px; border-bottom:1px solid var(--border); font-size:12.5px; vertical-align:middle;}
  table.painel tr:last-child td{border-bottom:none;}
  table.painel tbody tr:hover{background:var(--bg);}
  .cel-pessoa{display:flex; align-items:center; gap:9px; min-width:168px;}
  .avatar{width:32px; height:32px; flex:none; border-radius:999px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff;}
  .cel-pessoa .nome{font-weight:700;}
  .cel-pessoa .cargo{font-size:11.5px; color:var(--ink-faint); margin-top:1px;}
  .cel-meta{display:flex; align-items:center; gap:6px; color:var(--ink-soft); white-space:nowrap;}
  .barra{display:flex; align-items:center; gap:7px; min-width:104px;}
  .barra .trilho{display:block; flex:1; height:6px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
  .barra .preenchido{display:block; height:100%; border-radius:999px; background:var(--green); min-width:2px;}
  .barra .pct{font-size:11px; color:var(--ink-soft); font-variant-numeric:tabular-nums; min-width:30px; text-align:right;}
  .dias{font-variant-numeric:tabular-nums; font-weight:700;}
  .dias.vencido{color:var(--pending);}
  .acoes-cel{display:flex; align-items:center; gap:6px; justify-content:flex-end;}
  .paginacao{display:flex; align-items:center; gap:10px; padding:12px 16px; border-top:1px solid var(--border); flex-wrap:wrap;}

function statsFromFixedValues(nums){
  nums = nums.slice().sort(function(a,b){return a-b;});
  var n=nums.length; if(!n) return null;
  function pct(p){ var idx=(n-1)*p, lo=Math.floor(idx), hi=Math.ceil(idx); if(lo===hi) return nums[lo]; return nums[lo]+(nums[hi]-nums[lo])*(idx-lo); }
  return {n:n, min:nums[0], max:nums[n-1], median:pct(.5)};
}
/* estimativa padrão de encargos CLT (mesma metodologia já usada na pesquisa fornecida pelo Grupo Premium) */
var ENCARGOS_CLT = {inss:0.20, ratSat:0.02, sistemaS:0.058, fgts:0.08, decimoTerceiro:0.0833, feriasUmTerco:0.1111, rescisoria:0.04};
function totalEncargosPerc(){
  var t=0; Object.keys(ENCARGOS_CLT).forEach(function(k){ t+=ENCARGOS_CLT[k]; }); return t;
}
function custoMensalEmpresa(salarioBase, beneficios){
  var encargos = salarioBase * totalEncargosPerc();
  return salarioBase + encargos + (beneficios||0);
}
/* síntese técnica personalizada a partir das respostas (atividades, complexidade, autonomia,
   liderança, abrangência e impacto) — alimenta o resumo executivo do relatório em Excel */
function buildExecutiveNarrative(){
  var sc = computeScore();
  var bd = activityBreakdown().filter(function(b){ return b.n>0; });
  var atividadesTxt = bd.length ? bd.map(function(b){ return b.nome+" ("+b.n+"/"+b.total+")"; }).join("; ") : "nenhuma atividade detalhada ainda pelo gestor";

  var impactoNota = (state.scores.impacto&&state.scores.impacto.score) ? state.scores.impacto.score : null;
  var abrangenciaNota = (state.scores.abrangencia&&state.scores.abrangencia.score) ? state.scores.abrangencia.score : null;
  var partes = [];
  partes.push("O cargo de "+(val("ident_cargo")||"—")+" foi investigado a partir de "+(multiSummaryText("nec_motivos")||"necessidades de negócio declaradas pelo gestor")+", concentrando-se em: "+atividadesTxt+".");
  if(multiSummaryText("nec_problema")) partes.push("Situação atual relatada: "+multiSummaryText("nec_problema")+".");
  partes.push("Quanto à complexidade e autonomia, a avaliação técnica por fatores atribuiu nota "+(complexidadeNota||"—")+"/5 para complexidade e resolução de problemas e "+(autonomiaNota||"—")+"/5 para autonomia e poder de decisão"+(sc.complete?(", resultando em pontuação ponderada de "+sc.total.toFixed(2)+"/5,00"):", com avaliação técnica ainda incompleta")+".");
  if(val("aut_lideranca") && val("aut_lideranca")!=="Não terá subordinados nem liderança formal") partes.push("Em liderança, o desenho indicado é: "+val("aut_lideranca")+(multiSummaryText("aut_lideranca_natureza")?(" — "+multiSummaryText("aut_lideranca_natureza")):"")+", sem configurar necessariamente gestão formal de pessoas.");
  partes.push("Em abrangência e interfaces (nota "+(abrangenciaNota||"—")+"/5), a atuação prevista é: "+(val("vol_abrangencia")||"não definida")+", com interfaces frequentes em "+(multiSummaryText("req_interfaces")||"áreas a confirmar")+".");
  partes.push("Quanto ao impacto nos resultados (nota "+(impactoNota||"—")+"/5): "+(multiSummaryText("nec_impacto")||"impacto não detalhado pelo gestor")+".");
  return partes.join(" ");
}

function isOverdue(rec){
  if(!rec || !rec.prazo) return false;
  if([REQ_STATUS.CONCLUIDA, REQ_STATUS.RELATORIO, REQ_STATUS.CANCELADA].indexOf(rec.status)>=0) return false;
  return rec.prazo < new Date().toISOString().slice(0,10);
}
function statusBadge(rec){
  var map = {
    link_gerado:["gestor","Link gerado"], aguardando_preenchimento:["gestor","Aguardando preenchimento"],
    em_andamento:["estimate","Em andamento"], pendente_complementacao:["pending","Pendente de complementação"],
    concluida:["rh","Concluída"], relatorio_disponivel:["rh","Relatório disponível"], cancelada:["muted","Cancelada"]
  };
  var m = map[rec.status] || ["muted", rec.status||"—"];
  var html = badge(m[0], m[1]);
  if(isOverdue(rec)) html += " " + badge("pending","atrasada");
  return html;
}
/* Cópia profunda de um corpo vindo do banco. Snapshots do `db` são congelados e compartilhados
   entre entregas; qualquer escrita neles lança em strict mode. Tudo que vier do banco e for
   guardado em `state` (ou receber campos extras, como o id) passa por aqui antes. */
function cloneSnapshotData(d){
  if(d===null || typeof d!=="object") return d;
  try{ return JSON.parse(JSON.stringify(d)); }catch(e){ return {}; }
}
/* Documento de uma listagem/consulta, já como objeto próprio e com o id junto. */
function reqFromSnap(snap){
  var body = cloneSnapshotData(snap.data()||{});
  body.id = snap.id;
  return body;
}
/* ===== Controle de acesso à área técnica do RH =====
   A análise técnica (pontuação por fatores, enquadramento, geração dos relatórios) é exclusiva do
   RH. Numa solicitação aberta por link, quem está do outro lado é o SOLICITANTE: ele responde o
   questionário e nada mais — não deve ver nem alcançar as etapas do RH. No formulário avulso
   (modo local, sem solicitação vinculada) quem usa é o próprio RH no seu dispositivo, com dados
   que não saem dali, então o acesso permanece como sempre foi — inclusive se a identificação da
   conta não responder, para não trancar o RH fora da própria ferramenta. */
function isRHViewer(){ return !!(portalCanEdit || portalIsOwner); }
/* Quem entrou pelo LINK da solicitação (?req=...) está ali para responder o questionário — e só.
   A análise técnica e os relatórios pertencem ao painel: valem o ponto de entrada, não a identidade
   de quem abriu. Isso vale inclusive para o próprio RH abrindo o link que ele mesmo gerou: para
   gerar relatórios ele entra pelo painel e abre a solicitação por lá. Variável de módulo de
   propósito — não vai para o estado salvo, então nunca é restaurada de uma sessão anterior. */
var enteredByLink = false;
function canUseRHArea(){
  if(modoQuestionario) return false; // arquivo do gestor: só o questionário existe ali
  if(enteredByLink) return false;
  return state.reqId ? isRHViewer() : true;
}
function reqDocRef(id){ return portalDb.collection(REQ_COLLECTION).doc(id); }
function genReqId(){ return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
/* ===== Link do questionário =====
   A plataforma entrega à página apenas uma ÂNCORA SIMPLES do endereço: letras, dígitos, "." "_" "~"
   e "-". Query string (?req=) e âncora com chave=valor nunca chegam — foi por isso que o link antigo
   não abria solicitação nenhuma. O token abaixo corrige esse formato e carrega a identificação junto,
   dispensando consulta ao banco.
   ATENÇÃO, limite confirmado na prática: abrir o artifact exige conta Claude — quem não tem para numa
   tela de login. Por isso ESTE LINK NÃO É O MEIO DE ENTREGA ao gestor; a entrega é o arquivo do
   questionário. O link serve a quem já tem conta (o próprio RH, em outro aparelho). */
function b64urlEnc(txt){
  var bytes = new TextEncoder().encode(txt), bin="";
  for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64urlDec(txt){
  var b = txt.replace(/-/g,"+").replace(/_/g,"/");
  while(b.length % 4) b += "=";
  var bin = atob(b), bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function requestLink(rec, base){
  var r = (typeof rec==="string") ? {id:rec} : (rec||{});
  var pacote = {i:r.id||"", n:r.solicitanteNome||"", c:r.cargoPrevisto||"", u:r.unidadePrevista||"", p:r.prazo||""};
  return (base || location.href.split("#")[0]) + "#r-" + b64urlEnc(JSON.stringify(pacote));
}

/* ====================== PÁGINA PÚBLICA DO QUESTIONÁRIO ======================
   No iPhone, o arquivo .html recebido pelo WhatsApp abre na pré-visualização de arquivos, que NÃO
   executa scripts: aparece uma tela escura e vazia. Por isso o gestor sem conta recebe um LINK de
   uma página pública (hospedada pelo RH em GitHub Pages, Netlify etc.), que abre no Safari/Chrome.
   A página é a mesma deste sistema, sem nenhum dado: a solicitação vem no próprio link, depois do #,
   parte que o navegador NÃO envia ao servidor de hospedagem. As respostas voltam como código de
   resposta, importado pelo RH aqui no painel. O endereço fica salvo no banco (compartilhado pelo RH)
   e neste navegador. */
var PUBLIC_URL_KEY = "premium:urlPublica";
var urlPublica = "";
var urlPublicaErro = null, urlPublicaOk = null, pubPainelAberto = false;
function normalizarUrlPublica(txt){
  var t = String(txt||"").trim();
  if(!t) return {ok:true, url:""};
  if(!/^https:\/\//i.test(t)) return {ok:false, erro:"O endereço precisa começar com https://"};
  var u;
  try{ u = new URL(t); }catch(e){ return {ok:false, erro:"Endereço inválido. Cole o endereço completo da página, por exemplo https://seu-usuario.github.io/questionario/"}; }
  if(/(^|\.)claude\.ai$/i.test(u.hostname) || /(^|\.)claudeusercontent\.com$/i.test(u.hostname))
    return {ok:false, erro:"Este endereço é do próprio Claude e exige conta para abrir. Use o endereço da página hospedada fora dele."};
  if(/^(localhost|127\.|0\.0\.0\.0|\[::1\])/i.test(u.hostname))
    return {ok:false, erro:"Este endereço só funciona neste computador. Use o endereço público da página hospedada."};
  u.hash = ""; u.search = "";
  return {ok:true, url:u.toString()};
}
function lerUrlPublicaLocal(){ try{ return localStorage.getItem(PUBLIC_URL_KEY)||""; }catch(e){ return ""; } }
async function carregarUrlPublica(){
  var u = "";
  if(portalDb){
    try{
      var snap = await portalDb.doc("config/hospedagem").get();
      if(snap.exists){ var d = cloneSnapshotData(snap.data()||{}); if(d && typeof d.url==="string") u = d.url; }
    }catch(e){}
  }
  if(!u) u = lerUrlPublicaLocal();
  var n = normalizarUrlPublica(u);
  urlPublica = n.ok ? n.url : "";
}
async function salvarUrlPublica(txt){
  var n = normalizarUrlPublica(txt);
  if(!n.ok){ urlPublicaErro = n.erro; urlPublicaOk = null; return false; }
  urlPublica = n.url; urlPublicaErro = null;
  try{ if(n.url) localStorage.setItem(PUBLIC_URL_KEY, n.url); else localStorage.removeItem(PUBLIC_URL_KEY); }catch(e){}
  var gravou = false;
  if(portalDb){
    try{
      await portalDb.doc("config/hospedagem").set({url:n.url, updatedAt:new Date().toISOString()});
      gravou = true;
    }catch(e){}
  }
  urlPublicaOk = n.url
    ? (gravou ? "Endereço salvo. Os próximos envios já usam este link." : "Endereço salvo neste navegador (não foi possível gravar no portal).")
    : "Endereço removido. O envio volta a ser pelo arquivo.";
  return true;
}
function linkPublicoSolicitacao(rec){ return urlPublica ? requestLink(rec, urlPublica) : ""; }
function lerLinkQuestionario(){
  try{
    var m = (location.hash||"").match(/^#r-([A-Za-z0-9_-]+)$/);
    if(!m) return null;
    var d = JSON.parse(b64urlDec(m[1]));
    if(!d || !d.i) return null;
    return {id:d.i, solicitanteNome:d.n||"", cargoPrevisto:d.c||"", unidadePrevista:d.u||"", prazo:d.p||null, viaLink:true};
  }catch(e){ return null; }
}
/* ====================== QUESTIONÁRIO AUTOCONTIDO (gestor sem conta Claude) ======================
   O banco de dados deste artifact só responde a quem está autenticado numa conta Claude. Como os
   gestores do Grupo Premium não terão conta, o link individual não serve: eles não conseguiriam
   nem ler a solicitação nem gravar as respostas. O fluxo passa a ser:
     1. o RH gera, pelo painel, um ARQUIVO do questionário já identificado com a solicitação;
     2. o gestor abre esse arquivo no navegador dele — sem conta, funcionando offline — responde e
        no fim recebe um CÓDIGO DE RESPOSTA;
     3. o gestor devolve o código (WhatsApp) e o RH importa no painel, preenchendo a solicitação.
   O arquivo é a própria página, serializada e com a configuração da solicitação injetada. */
var QMODE = (window.__PREMIUM_QUESTIONARIO__ && window.__PREMIUM_QUESTIONARIO__.id) ? window.__PREMIUM_QUESTIONARIO__ : null;
var modoQuestionario = false, questionarioJaIniciado = false;
var MARCA_SIMPLES = "PREMIUM1:", MARCA_ZIP = "PREMIUMZ1:";

/* Serializa a página atual como um arquivo HTML independente, com a solicitação embutida. */
function montarArquivoQuestionario(rec, imagemEmbutida){
  var clone = document.documentElement.cloneNode(true);
  var app = clone.querySelector("#app"); if(app) app.innerHTML = "";           // a página se redesenha sozinha
  Array.prototype.slice.call(clone.querySelectorAll("script[src]")).forEach(function(s){
    if(s.parentNode) s.parentNode.removeChild(s);                              // ExcelJS/runtime não servem ao gestor
  });
  /* Nada de <img> a reescrever aqui: o #app acabou de ser esvaziado e a capa é escrita pelo próprio
     script, a partir da configuração abaixo. Por isso ela vai embutida em cfg.capa. */
  /* rec === null: página pública genérica (sem nenhuma solicitação embutida) para hospedar. */
  var cfg = rec ? {
    id: rec.id, solicitanteNome: rec.solicitanteNome||"", solicitanteContato: rec.solicitanteContato||"",
    unidadePrevista: rec.unidadePrevista||"", cargoPrevisto: rec.cargoPrevisto||"", prazo: rec.prazo||null,
    geradoEm: new Date().toISOString(),
    capa: imagemEmbutida || null
  } : { capa: imagemEmbutida || null };
  /* Só ASCII na configuração: nome com acento não depende da codificação que o celular adivinhar. */
  var cfgJson = JSON.stringify(cfg).replace(/</g,"\\u003c").replace(/[\u0080-\uffff]/g, function(ch){
    return "\\u" + ("0000"+ch.charCodeAt(0).toString(16)).slice(-4);
  });
  var tag = document.createElement("script");
  tag.textContent = (rec ? "window.__PREMIUM_QUESTIONARIO__ = " : "window.__PREMIUM_PUBLICO__ = ") + cfgJson + ";";
  var head = clone.querySelector("head") || clone.firstChild;
  head.insertBefore(tag, head.firstChild);
  /* Codificação e viewport precisam estar logo no início do arquivo (navegadores só olham o começo).
     Antes, o <meta charset> ficava depois de ~200 KB de imagem embutida: navegadores e visualizadores
     de celular que não adivinham UTF-8 mostravam o texto quebrado ou nem abriam. */
  Array.prototype.slice.call(clone.querySelectorAll("meta[charset]")).forEach(function(m){ m.parentNode.removeChild(m); });
  var mc = document.createElement("meta"); mc.setAttribute("charset","utf-8");
  var mv = clone.querySelector('meta[name="viewport"]');
  if(!mv){ mv = document.createElement("meta"); mv.setAttribute("name","viewport"); mv.setAttribute("content","width=device-width,initial-scale=1"); }
  else if(mv.parentNode) mv.parentNode.removeChild(mv);
  head.insertBefore(mv, head.firstChild);
  head.insertBefore(mc, head.firstChild);
  /* Sem BOM de propósito: quando o celular não informa o tipo do arquivo, o navegador identifica o
     conteúdo pelo começo, e um BOM faz ele tratar o arquivo como texto puro e mostrar o código-fonte. */
  return "<!doctype html>\n" + clone.outerHTML;
}
function nomeArquivoQuestionario(rec){
  var base = (rec.solicitanteNome||"solicitante").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
             .replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_+|_+$/g,"");
  return "Questionario_Premium_"+(base||"solicitante")+".html";
}
/* A capa do Grupo Premium é um arquivo separado do artifact; num arquivo solto, aberto do celular
   e possivelmente offline, ela só aparece se viajar embutida. Melhor esforço: falhando, o arquivo é
   gerado sem a imagem em vez de não ser gerado. */
function imagemCapaEmbutida(){
  return fetch("premium-hero.jpg").then(function(r){
    if(!r.ok) throw new Error("capa indisponível");
    return r.blob();
  }).then(function(blob){
    return new Promise(function(ok, falhou){
      var fr = new FileReader();
      fr.onload = function(){ ok(String(fr.result||"")); };
      fr.onerror = function(){ falhou(new Error("leitura da capa")); };
      fr.readAsDataURL(blob);
    });
  }).catch(function(){ return null; });
}
async function baixarQuestionario(rec){
  var capa = await imagemCapaEmbutida();
  var html = montarArquivoQuestionario(rec, capa);
  var blob = new Blob([html], {type:"text/html;charset=utf-8"});
  var nome = nomeArquivoQuestionario(rec);
  var downloads = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
  if(downloads){ await downloads.save({filename:nome, data:blob}); return; }
  var url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href=url; a.download=nome; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

async function baixarPaginaPublica(){
  var capa = await imagemCapaEmbutida();
  var html = montarArquivoQuestionario(null, capa);
  var blob = new Blob([html], {type:"text/html;charset=utf-8"});
  var downloads = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
  if(downloads){ await downloads.save({filename:"index.html", data:blob}); return; }
  var url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href=url; a.download="index.html"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

/* ---- código de resposta: só as respostas do gestor, nada do lado do RH ---- */
function payloadResposta(){
  return {v:1, id:state.reqId||(QMODE&&QMODE.id)||"", at:new Date().toISOString(),
          nome:(state.values&&state.values.ident_nome)||"",
          values:state.values||{}, multi:state.multi||{}, unknown:state.unknown||{}, activities:state.activities||{}};
}
function bytesParaBase64(bytes){
  var bin="", passo=8192;
  for(var i=0;i<bytes.length;i+=passo) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+passo));
  return btoa(bin);
}
function base64ParaBytes(b64){
  var bin = atob(b64), out = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function montarCodigoResposta(){
  var bytes = new TextEncoder().encode(JSON.stringify(payloadResposta()));
  if(window.CompressionStream){                      // encolhe bastante; sem suporte, vai sem compressão
    try{
      var fluxo = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
      bytes = new Uint8Array(await new Response(fluxo).arrayBuffer());
      return MARCA_ZIP + bytesParaBase64(bytes);
    }catch(e){ bytes = new TextEncoder().encode(JSON.stringify(payloadResposta())); }
  }
  return MARCA_SIMPLES + bytesParaBase64(bytes);
}
async function lerCodigoResposta(texto){
  /* O gestor normalmente cola a MENSAGEM INTEIRA do WhatsApp, com a saudação em volta do código —
     por isso o código é procurado dentro do texto, não exigido no começo dele. */
  var t = String(texto||"").replace(/\s+/g,"");
  var achou = t.match(/PREMIUM(Z?)1:([A-Za-z0-9+/=_-]+)/);
  if(!achou) throw new Error("Não encontrei um código de resposta neste texto. Peça ao gestor para reenviar o código, ou use o arquivo de resposta.");
  var zip = achou[1]==="Z";
  var bytes = base64ParaBytes(achou[2]);
  if(zip){
    if(!window.DecompressionStream) throw new Error("Este navegador não consegue abrir o código compactado — peça ao gestor o arquivo de resposta, ou abra o painel em um navegador mais recente.");
    var fluxo = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    bytes = new Uint8Array(await new Response(fluxo).arrayBuffer());
  }
  var dados = JSON.parse(new TextDecoder().decode(bytes));
  if(!dados || typeof dados!=="object" || !dados.values) throw new Error("O código foi lido, mas não contém respostas válidas.");
  return dados;
}
/* Lembrete local (apenas neste navegador/dispositivo do RH) de qual foi a última solicitação criada,
   para que um recarregamento (F5) da tela de "link gerado" não leve direto ao painel, perdendo o link —
   a tela de sucesso em si continua vindo do registro em `db` (ver REQ_COLLECTION), nunca duplicada aqui. */
var NOVA_RECALL_KEY = STORE_KEY+":lastNova";
var NOVA_RECALL_MAX_AGE_MS = 6*60*60*1000; // 6h: além disso, considera-se obsoleto e o painel normal é mostrado
function rememberNovaScreen(id){ try{ localStorage.setItem(NOVA_RECALL_KEY, JSON.stringify({id:id, at:Date.now()})); }catch(e){} }
function forgetNovaScreen(){ try{ localStorage.removeItem(NOVA_RECALL_KEY); }catch(e){} }
function recallNovaScreen(){
  try{
    var raw = JSON.parse(localStorage.getItem(NOVA_RECALL_KEY)||"null");
    if(!raw || !raw.id) return null;
    if((Date.now()-(raw.at||0)) > NOVA_RECALL_MAX_AGE_MS){ forgetNovaScreen(); return null; }
    return raw.id;
  }catch(e){ return null; }
}

function stateDataSnapshot(){
  return {values:state.values, multi:state.multi, unknown:state.unknown, activities:state.activities,
    tables:state.tables, scores:state.scores, weights:state.weights,
    gestorConfirmed:state.gestorConfirmed, reportVersion:state.reportVersion,
    gStep:state.gStep, rStep:state.rStep};
}
function applyDataSnapshot(d){
  /* Os snapshots entregues pelo banco são CONGELADOS (Object.freeze), e todo este script roda em
     "use strict": escrever em qualquer objeto vindo de snap.data() lança TypeError. Como o estado
     abaixo é editado o tempo todo durante o preenchimento, aqui ele entra sempre como cópia própria. */
  d = d ? cloneSnapshotData(d) : {};
  if(!d || typeof d!=="object" || Array.isArray(d)) d = {};
  /* Registros gravados por versões anteriores podem ter campos ausentes ou com o tipo errado;
     cada um entra validado para que um dado legado não derrube a abertura do link inteira. */
  function objOf(v){ return (v && typeof v==="object" && !Array.isArray(v)) ? v : {}; }
  state.values=objOf(d.values); state.multi=objOf(d.multi); state.unknown=objOf(d.unknown);
  state.activities=objOf(d.activities);
  state.tables=objOf(d.tables);
  if(!Array.isArray(state.tables.market)) state.tables.market=[];
  if(!Array.isArray(state.tables.equity)) state.tables.equity=[];
  if(!state.tables.market||!state.tables.market.length) state.tables.market=[blankRow(MARKET_COLS)];
  if(!state.tables.equity||!state.tables.equity.length) state.tables.equity=[blankRow(EQUITY_COLS)];
  state.scores=objOf(d.scores);
  var w = objOf(d.weights);
  state.weights = Object.keys(w).length ? w : defaultWeights();
  state.gestorConfirmed=!!d.gestorConfirmed; state.reportVersion=Number(d.reportVersion)||0;
  state.gStep=Math.max(0, Math.min(GESTOR_STEPS.length-1, Number(d.gStep)||0));
  state.rStep=Math.max(0, Math.min(RH_STEPS.length-1, Number(d.rStep)||0));
  if(!state.catalog) state.catalog = JSON.parse(JSON.stringify(DEFAULT_CATALOG));
  if(!state.values.ident_cargo) state.values.ident_cargo = (state.reqMeta&&state.reqMeta.cargoPrevisto) || "Controlador(a) de Ativos e Consignação";
}
function loadRecordIntoState(rec){
  state.reqId = rec.id;
  state.reqMeta = {solicitanteNome:rec.solicitanteNome, solicitanteContato:rec.solicitanteContato,

function setReqStatus(id, status, note){
  if(!portalDb) return Promise.resolve();
  var ref = reqDocRef(id);
  return ref.get().then(function(snap){
    var cur = snap.exists ? snap.data() : {};
    var hist = (cur.history||[]).slice();
    hist.push({at:new Date().toISOString(), status:status, note:note||""});
    if(hist.length>40) hist = hist.slice(hist.length-40);
    var patch = {status:status, history:hist, updatedAt:new Date().toISOString()};
    if(status===REQ_STATUS.CONCLUIDA) patch.submittedAt = new Date().toISOString();
    if(status===REQ_STATUS.RELATORIO) patch.reportGeneratedAt = new Date().toISOString();
    if(status===REQ_STATUS.AGUARDANDO && !cur.firstOpenedAt) patch.firstOpenedAt = new Date().toISOString();
    return ref.update(patch);
  }).catch(function(){ /* melhor esforço — não bloqueia a navegação do usuário */ });
}

    state._emAndamentoSet = true;

    state.reqMeta.status = REQ_STATUS.EM_ANDAMENTO;

function sortReqListDesc(list){

function startPainelSubscription(){
  stopPainelSubscription();
  if(!portalDb){ portalPainelError="unavailable"; portalPainelLoading=false; return; }
  portalPainelLoading = (portalPainelList===null);
  /* Busca direta, além da assinatura ao vivo: não depende de orderBy (que exige índice/ordenação
     consistente no backend) nem de o onSnapshot entregar o primeiro evento — evita o painel ficar
     "vazio" quando na verdade há solicitações cadastradas, mas a entrega inicial do streaming falhou
     silenciosamente. A ordenação por data é feita aqui, no cliente. */
  try{
    portalDb.collection(REQ_COLLECTION).get().then(function(qs){
      portalPainelList = sortReqListDesc(qs.docs.map(reqFromSnap));
      portalPainelLoading=false; portalPainelError=null; portalUltimaAtualizacao=new Date();
      if(state.view==="painel") render();
    }).catch(function(err){
      portalPainelLoading=false;
      if(portalPainelList===null) portalPainelError=(err&&err.code)||"erro";
      if(state.view==="painel") render();
    });
  }catch(e){}
  try{
    portalPainelUnsub = portalDb.collection(REQ_COLLECTION).onSnapshot(function(qs){
      portalPainelList = sortReqListDesc(qs.docs.map(reqFromSnap));
      portalPainelLoading=false; portalPainelError=null; portalUltimaAtualizacao=new Date();
      if(state.view==="painel") render();
    }, function(err){ portalPainelLoading=false; if(portalPainelList===null) portalPainelError=(err&&err.code)||"erro"; if(state.view==="painel") render(); });
  }catch(e){ portalPainelLoading=false; if(portalPainelList===null) portalPainelError="erro"; }
}

function painelFilteredList(){

    if(portalPainelFilterResp!=="all" && respPor(r)!==portalPainelFilterResp) return false;
    if(portalPainelFilterPrazo!=="all"){
      var d = diasAtePrazo(r);
      if(portalPainelFilterPrazo==="semprazo" && d!==null) return false;
      if(portalPainelFilterPrazo==="comprazo" && d===null) return false;
      if(portalPainelFilterPrazo==="vencido" && !isOverdue(r)) return false;
      if(portalPainelFilterPrazo==="3dias" && !(d!==null && d>=0 && d<=3 && !isOverdue(r))) return false;
    }
    if(!q) return true;
    var hay = ((r.solicitanteNome||"")+" "+(r.cargoPrevisto||"")+" "+(r.unidadePrevista||"")).toLowerCase();

function painelStats(list){
  var s={total:0, aguardando:0, andamento:0, concluida:0, relatorio:0, atrasadas:0, canceladas:0};
  list.forEach(function(r){
    s.total++;
    if(r.status===REQ_STATUS.LINK_GERADO||r.status===REQ_STATUS.AGUARDANDO) s.aguardando++;
    else if(r.status===REQ_STATUS.EM_ANDAMENTO||r.status===REQ_STATUS.PENDENTE) s.andamento++;
    else if(r.status===REQ_STATUS.CONCLUIDA) s.concluida++;
    else if(r.status===REQ_STATUS.RELATORIO) s.relatorio++;
    else if(r.status===REQ_STATUS.CANCELADA) s.canceladas++;
    if(isOverdue(r)) s.atrasadas++;
  });
  return s;
}

async function openRequestByLink(id){
  enteredByLink = true;

    var cached=null;
    try{ cached = JSON.parse(localStorage.getItem(STORE_KEY+":"+id)||"null"); }catch(e){}
    state.reqMeta = {status:REQ_STATUS.EM_ANDAMENTO, solicitanteNome:"", offline:true};
    applyDataSnapshot(cached);
    state._emAndamentoSet = true;
    state.view="gestor";
    render();
    return;
  }
  try{
    var snap = await reqDocRef(id).get();
    if(!snap.exists){ state.reqMeta={notFound:true}; state.view="link-invalido"; render(); return; }
    var rec = reqFromSnap(snap);
    if(rec.status===REQ_STATUS.CANCELADA){ state.reqMeta=Object.assign({},rec,{cancelled:true}); state.view="link-invalido"; render(); return; }
    loadRecordIntoState(rec);
    if(rec.status===REQ_STATUS.LINK_GERADO) setReqStatus(id, REQ_STATUS.AGUARDANDO, "Link aberto pelo solicitante.");
    state.view = ([REQ_STATUS.CONCLUIDA, REQ_STATUS.RELATORIO].indexOf(rec.status)>=0) ? "solicitante-status" : "gestor";
    render();
  }catch(err){
    state.reqMeta={notFound:true, errorCode: (err&&(err.code||err.message))||"erro"};
    state.view="link-invalido";
    render();
  }
}
async function openRecordForRH(id, targetView){
  enteredByLink = false;
  /* Antes esta função falhava em silêncio (return vazio e catch vazio): o RH clicava, nada
     acontecia na tela e não havia pista do motivo. Agora toda saída dá retorno visível. */
  portalActionError = null;
  if(!portalDb){
    portalActionError = "O banco de dados do portal não está disponível nesta sessão — não foi possível abrir a solicitação.";
    render(); return;
  }
  try{
    var snap = await reqDocRef(id).get();
    if(!snap.exists){
      goPainel();
      portalActionError = "Esta solicitação não foi encontrada no portal (id "+id+"). Ela pode ter sido removida, ou este link pertence a outro artifact.";
      render(); return;
    }
    var rec = reqFromSnap(snap);
    if(targetView==="rh" && !(rec.data && rec.data.gestorConfirmed)){
      goDetalhe(id); // avaliação técnica ainda não liberada — mantém o RH na visão de detalhe
      return;
    }
    stopPainelSubscription(); stopDetalheSubscription();
    loadRecordIntoState(rec);
    state.view = targetView;
    render();
  }catch(e){
    goPainel();
    portalActionError = "Não foi possível abrir esta solicitação ("+((e&&(e.code||e.message))||"erro")+"). Os dados gravados podem estar incompletos.";
    render();
  }
}

/* Abertura do arquivo pelo gestor: sem conta, sem portal, possivelmente offline. O progresso fica
   no navegador dele (mesma chave por solicitação já usada pelo modo sem conexão), então ele pode
   fechar e retomar depois sem perder o que respondeu. */
function iniciarModoQuestionario(){
  modoQuestionario = true;
  enteredByLink = true;
  state.reqId = QMODE.id;
  state.reqMeta = {solicitanteNome:QMODE.solicitanteNome||"", solicitanteContato:QMODE.solicitanteContato||"",
    unidadePrevista:QMODE.unidadePrevista||"", cargoPrevisto:QMODE.cargoPrevisto||"", prazo:QMODE.prazo||null,
    status:REQ_STATUS.EM_ANDAMENTO, offline:true, history:[]};
  var cache=null;
  try{ cache = JSON.parse(localStorage.getItem(STORE_KEY+":"+QMODE.id)||"null"); }catch(e){}
  /* "Continuar" só faz sentido se houver resposta DO GESTOR — nome e cargo já chegam preenchidos
     pelo RH, então não contam como progresso. */
  questionarioJaIniciado = !!(cache && (
    Object.keys(cache.values||{}).some(function(k){ return k!=="ident_nome" && k!=="ident_cargo" && cache.values[k]; }) ||
    Object.keys(cache.multi||{}).length || Object.keys(cache.activities||{}).length));
  applyDataSnapshot(cache);
  if(QMODE.cargoPrevisto && !val("ident_cargo")) state.values.ident_cargo = QMODE.cargoPrevisto;
  if(QMODE.solicitanteNome && !val("ident_nome")) state.values.ident_nome = QMODE.solicitanteNome;
  state._emAndamentoSet = true;
  state.view = "home";   // boas-vindas primeiro; o questionário começa pelo botão
  render();
}
async function initPortal(){
  if(QMODE){ iniciarModoQuestionario(); return; } // arquivo autocontido: não depende de conta nem de banco
  var viaLink = lerLinkQuestionario();
  if(viaLink) renderBootScreen("Abrindo sua solicitação…");
  try{
    if(window.claude && window.claude.use){
      portalDb = await window.claude.use("db").catch(function(){return null;});
      portalUser = await window.claude.use("user").catch(function(){return null;});
      if(portalUser){
        try{
          portalIsOwner = await portalUser.isOwner();
          portalCanEdit = await portalUser.canEdit();
          portalUserId = await portalUser.id();
        }catch(e){}
      }
    }
  }catch(e){}
  if(viaLink){
    /* Com banco e conta, o link abre a solicitação de verdade e sincroniza. Sem banco — o caso de
       quem não tem conta Claude —, o mesmo link vira o questionário local, identificado por ele
       próprio, com devolução por código. */
    if(portalDb){ await openRequestByLink(viaLink.id); return; }
    QMODE = viaLink; iniciarModoQuestionario(); return;
  }
  if(portalCanEdit || portalIsOwner){
    await carregarUrlPublica();
    var recallId = recallNovaScreen();
    if(recallId && portalDb){
      try{
        var snap = await reqDocRef(recallId).get();
        if(snap.exists){
          var rec = reqFromSnap(snap);
          if(rec.status===REQ_STATUS.LINK_GERADO){
            // ainda não foi aberta pelo solicitante: restaura a mesma tela de sucesso com o link
            state.view="nova"; state.novaCriada=rec; render();
            return;
          }
        }
      }catch(e){}
      // link já foi aberto pelo solicitante (ou a solicitação não existe mais): a tela de "link gerado"
      // não faz mais sentido — leva direto ao detalhe, que também mostra o link e já reflete o andamento
      forgetNovaScreen();
      goDetalhe(recallId);
      return;
    }
    forgetNovaScreen();
    state.view="painel"; render(); startPainelSubscription();
  }
}

function esc(s){ s=(s===undefined||s===null)?"":String(s); return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function nl2br(s){ return esc(s).replace(/\n/g,"<br>"); }
function val(id){ return state.values[id]||""; }
function isUnknown(id){ return !!state.unknown[id]; }
function sel(id,opt){ return (state.multi[id]||{})[opt]; }

function badge(kind,label){ return '<span class="badge badge-'+kind+'">'+esc(label)+'</span>'; }
function intro(t){ return '<p class="step-intro">'+t+'</p>'; }

function field(id,label,type,opts){
  opts=opts||{};
  var unknownOn=isUnknown(id), v=val(id), ctrl="";
  if(type==="textarea"){
    ctrl='<textarea class="textarea" data-field="'+id+'" placeholder="'+esc(opts.placeholder||"")+'" '+(unknownOn?"disabled":"")+' style="min-height:'+(opts.rows?opts.rows*22:70)+'px">'+esc(v)+'</textarea>';
  } else if(type==="select"){
    var oh='<option value=""'+(v===""?" selected":"")+'>'+esc(opts.placeholder||"Selecionar…")+'</option>';
    (opts.options||[]).forEach(function(o){ oh+='<option value="'+esc(o)+'"'+(v===o?" selected":"")+'>'+esc(o)+'</option>'; });
    ctrl='<select class="select" data-field="'+id+'" '+(unknownOn?"disabled":"")+'>'+oh+'</select>';
  } else if(type==="number"){
    ctrl='<input class="input mono" type="number" inputmode="decimal" data-field="'+id+'" value="'+esc(v)+'" placeholder="'+esc(opts.placeholder||"")+'" '+(unknownOn?"disabled":"")+'>';
  } else {
    ctrl='<input class="input" type="text" data-field="'+id+'" value="'+esc(v)+'" placeholder="'+esc(opts.placeholder||"")+'" '+(unknownOn?"disabled":"")+'>';
  }
  var ut = opts.unknown ? ('<label class="unknown-toggle"><input type="checkbox" data-unknown="'+id+'" '+(unknownOn?"checked":"")+'> '+(opts.unknownLabel||"Não temos esse levantamento")+'</label>') : "";
  return '<div class="field'+(unknownOn?" is-unknown":"")+'"><div class="field-head"><label class="lbl">'+label+(opts.required?' <span class="req">*</span>':'')+'</label>'+ut+'</div>'+ctrl+(opts.help?'<div class="help">'+opts.help+'</div>':'')+'</div>';
}
/* single-select "choice" question (radio pills) with optional "outro" free text */
function question(num, id, title, options, kind, opts){
  opts=opts||{};
  var isMulti = kind==="multi";
  var choicesHtml = options.map(function(o){
    var checked = isMulti ? !!sel(id,o) : (val(id)===o);
    var inputHtml = isMulti
      ? '<input type="checkbox" data-multi="'+id+'" data-opt="'+esc(o)+'" '+(checked?"checked":"")+'>'
      : '<input type="radio" name="q_'+id+'" data-choice="'+id+'" value="'+esc(o)+'" '+(checked?"checked":"")+'>';
    return '<label class="choice">'+inputHtml+'<span>'+esc(o)+'</span></label>';
  }).join("");
  var outroKey = opts.outroOption;
  var outroOn = outroKey ? (isMulti ? !!sel(id,outroKey) : val(id)===outroKey) : false;
  var outroField = (outroKey && outroOn) ? ('<div style="margin-top:10px">'+field(id+"__outro", opts.outroLabel||"Especifique", "text", {})+'</div>') : "";
  return (
    '<div class="qn" data-qn="'+id+'">'+
      '<div class="qn-head"><span class="qn-num">'+num+'</span><span class="qn-title">'+title+(opts.required?' <span class="req">*</span>':'')+'</span></div>'+
      (opts.help?'<div class="qn-help">'+opts.help+'</div>':'')+
      '<div class="choice-grid">'+choicesHtml+'</div>'+
      outroField+
    '</div>'
  );
}

/* ====================== MOTOR DE PERGUNTAS CONDICIONAIS ======================
   Regras do ajuste funcional: exibir apenas o que é pertinente, e DESCONSIDERAR o que deixou de
   ser aplicável. O registro abaixo é a fonte única da verdade: cada entrada diz quais campos só
   existem sob certa condição. O render usa isso para mostrar; limparRespostasOcultas() usa o mesmo
   registro para apagar o que ficou órfão quando o gestor muda uma resposta anterior — sem isso, uma
   resposta de um bloco abandonado continuaria viajando para o relatório. */
function anyMulti(id){ var m=state.multi[id]||{}; return Object.keys(m).some(function(k){return m[k];}); }
function multiHas(id,opt){ return !!(state.multi[id]||{})[opt]; }
function multiSoTem(id,opt){
  var m=state.multi[id]||{}, ks=Object.keys(m).filter(function(k){return m[k];});
  return ks.length===1 && ks[0]===opt;
}
function cond(html){ return '<div class="cond-bloco">'+html+'</div>'; }

/* condições nomeadas, usadas no render e na limpeza */
var COND = {
  tipoNovo: function(){ return ["Criação de novo cargo","Ampliação da equipe"].indexOf(val("ident_tipo"))>=0; },
  tipoSubstituicao: function(){ return val("ident_tipo")==="Substituição de colaborador"; },
  tipoAlteracao: function(){ return ["Reestruturação de cargo existente","Alteração das responsabilidades de uma função"].indexOf(val("ident_tipo"))>=0; },
  temDeslocamento: function(){ return ["Sim, eventualmente","Sim, frequentemente"].indexOf(val("vol_deslocamento"))>=0; },
  temResponsabilidade: function(){ return anyMulti("aut_responsabilidade"); },
  temAlcada: function(){ return ["Sim, dentro de limites previamente definidos","Sim, conforme alçadas de aprovação"].indexOf(val("aut_alcada"))>=0; },
  temSubordinados: function(){ return val("aut_lideranca")==="Terá subordinados diretos"; },
  temCoordenacao: function(){
    return ["Coordenará atividades de outras pessoas, sem subordinados diretos",
            "Exercerá liderança funcional sobre equipes de diferentes unidades",
            "Orientará vendedores, gestores e colaboradores sobre procedimentos, sem autoridade hierárquica"].indexOf(val("aut_lideranca"))>=0;
  },
  temDigitalizacao: function(){
    return anyMulti("dig_prioridades") && !multiSoTem("dig_prioridades","Não há necessidade identificada no momento");
  },
  temFerramenta: function(){
    return COND.temDigitalizacao() && ["Sim, sistema corporativo","Sim, planilhas ou formulários","Sim, mas precisa ser aprimorado"].indexOf(val("dig_ferramenta"))>=0;
  },
  temIndicadores: function(){ return anyMulti("ind_sugestoes"); },
  temSistemaERP: function(){ return multiHas("req_conhecimentos","Sistemas de gestão/ERP"); },
  temCertificacao: function(){ return val("req_certificacao")==="Sim"; },

  /* ---- escopos de gestão de ativos (integração dos documentos ao questionário) ----
     Cada escopo abre um único bloco complementar. Nada é presumido pelo nome do cargo:
     o bloco só existe se o próprio solicitante marcar o escopo na pergunta 8.1. */
  escopoA: function(){ return multiHas("esc_escopos", ESCOPOS[0]); },
  escopoB: function(){ return multiHas("esc_escopos", ESCOPOS[1]); },
  escopoC: function(){ return multiHas("esc_escopos", ESCOPOS[2]); },
  escopoD: function(){ return multiHas("esc_escopos", ESCOPOS[3]); },
  escopoE: function(){ return multiHas("esc_escopos", ESCOPOS[4]); },
  /* a classificação técnica (obrigatório/desejável/não aplicável) reaproveita a pergunta 26:
     só aparece se o escopo E foi marcado E já existem conhecimentos selecionados lá. */
  temClassificacaoTecnica: function(){
    return COND.escopoE() && anyMulti("req_conhecimentos") && !multiSoTem("req_conhecimentos","Não sei informar");
  },
  /* sobreposição entre áreas: alguma atividade típica de outra área foi marcada */
  temSobreposicao: function(){
    var m = state.multi["lim_fronteira"]||{};
    return Object.keys(m).some(function(k){
      return m[k] && k!=="Nenhuma dessas atividades" && k!=="Ainda não definido";
    });
  }
};
/* rótulos dos escopos — fonte única, usada na pergunta, nas condições e nos relatórios */
var ESCOPOS = [
  "Controle patrimonial e cadastral de bens",
  "Acompanhamento operacional e conferências",
  "Contratos, termos e conformidade documental",
  "Indicadores e relatórios de controle",

  "Nenhum desses escopos se aplica"
];
/* conhecimentos da pergunta 26 — extraídos para constante porque a classificação
   técnica do escopo E gera um campo estável por item (esc_tec_<índice>). */
var CONHECIMENTOS = ["Excel ou planilhas","Sistemas de gestão/ERP","Controle de estoque e inventário","Gestão patrimonial","Controle de documentos e contratos","Indicadores e relatórios","Gestão de processos","Ferramentas digitais e automação","Atendimento a clientes","Conhecimentos financeiros","Outro","Não sei informar"];

function conhecimentosSelecionados(){
  return CONHECIMENTOS.map(function(c,i){ return {txt:c, id:"esc_tec_"+i}; })
    .filter(function(c){ return multiHas("req_conhecimentos", c.txt) && c.txt!=="Não sei informar"; });
}

/* campo(s) que só existem enquanto a condição for verdadeira */
var BLOCOS_CONDICIONAIS = [
  {quando:"tipoNovo",         campos:["ident_justificativa","ident_situacaoAtual"]},
  {quando:"tipoSubstituicao", campos:["ident_cargoAnterior","ident_substituicao"]},
  {quando:"tipoAlteracao",    campos:["ident_mudanca"]},
  {quando:"temDeslocamento",  campos:["desl_frequencia","desl_finalidade","desl_abrangencia","desl_pernoite","vol_veiculo"]},
  {quando:"temResponsabilidade", campos:["aut_atuacao"]},
  {quando:"temAlcada",        campos:["aut_alcada_faixa","aut_alcada_tipos"]},
  {quando:"temSubordinados",  campos:["lid_quantidade","lid_atividades","lid_autonomia","lid_equipe"]},
  {quando:"temCoordenacao",   campos:["aut_lideranca_natureza"]},
  {quando:"temDigitalizacao", campos:["dig_ganho","dig_solucao","dig_ferramenta"]},
  {quando:"temFerramenta",    campos:["dig_ferramenta_nome"]},
  {quando:"temIndicadores",   campos:["ind_meta","ind_frequencia","ind_fonte"]},
  {quando:"temSistemaERP",    campos:["req_sistema"]},

  {quando:"escopoA",          campos:["esc_pat_categorias","esc_pat_atuacao"]},

  {quando:"temSobreposicao",  campos:["lim_fronteira_modo"]}
];
function limparRespostasOcultas(){
  var mudou = false;
  /* classificação técnica: um campo por conhecimento marcado na pergunta 26.
     Se o escopo E for desmarcado, ou se o conhecimento deixar de estar selecionado,
     a classificação correspondente deixa de existir e não viaja para o relatório. */
  var validos = {};
  if(COND.temClassificacaoTecnica()) conhecimentosSelecionados().forEach(function(c){ validos[c.id]=true; });
  CONHECIMENTOS.forEach(function(_,i){
    var id = "esc_tec_"+i;
    if(validos[id]) return;
    if(state.values[id]){ delete state.values[id]; mudou = true; }
  });
  BLOCOS_CONDICIONAIS.forEach(function(b){
    if(COND[b.quando]()) return;
    b.campos.forEach(function(id){
      if(state.values[id]){ delete state.values[id]; mudou = true; }
      if(state.values[id+"__outro"]){ delete state.values[id+"__outro"]; mudou = true; }
      if(state.multi[id]){ delete state.multi[id]; mudou = true; }
      if(state.unknown[id]){ delete state.unknown[id]; mudou = true; }
    });
  });
  return mudou;
}

/* Classificação técnica (escopo E): reaproveita os conhecimentos já marcados na pergunta 26 e
   pede apenas o grau de exigência de cada um — obrigatório, desejável ou não aplicável.
   Nenhum item novo é introduzido aqui: se o conhecimento não foi marcado em 26, ele não aparece. */
function renderClassificacaoTecnica(){
  var itens = conhecimentosSelecionados();
  if(!itens.length) return "";
  var rows = itens.map(function(c){
    var label = (c.txt==="Outro" && val("req_conhecimentos__outro")) ? ("Outro: "+val("req_conhecimentos__outro")) : c.txt;
    var pills = CLASSIF_TEC.map(function(op){
      return '<label class="choice"><input type="radio" name="q_'+c.id+'" data-choice="'+c.id+'" value="'+esc(op)+'" '+(val(c.id)===op?"checked":"")+'><span>'+esc(op)+'</span></label>';
    }).join("");
    return '<div class="classif-row"><div class="classif-label">'+esc(label)+'</div><div class="choice-grid classif-pills">'+pills+'</div></div>';
  }).join("");
  return (
    '<div class="qn" data-qn="esc_tec">'+
      '<div class="qn-head"><span class="qn-num">26.2</span><span class="qn-title">Para cada conhecimento marcado, qual é o grau de exigência?</span></div>'+
      '<div class="qn-help">Classifique o que é indispensável para executar o trabalho e o que é apenas desejável. Itens sem classificação ficam registrados como “não classificado” — não são presumidos como obrigatórios.</div>'+
      rows+
    '</div>'
  );
}
function classificacaoTecnicaTexto(){
  var itens = conhecimentosSelecionados();

/* ---- consolidação dos escopos declarados ----
   Fonte única para a síntese, para o Relatório A e para a planilha. Só devolve o que o
   solicitante efetivamente marcou: escopo não marcado não gera bloco, e campo não
   respondido aparece como "não informado" — nunca preenchido por inferência. */
function escoposDeclarados(){
  var out = [];
  function bloco(titulo, linhas){
    out.push({titulo:titulo, linhas:linhas.filter(function(l){ return !!l; })});
  }
  function L(rot, txt){ return txt ? [rot, txt] : [rot, "não informado"]; }
  if(COND.escopoA()) bloco(ESCOPOS[0], [
    L("Categorias de bens sob controle", multiSummaryText("esc_pat_categorias")),
    L("Atuação sobre esses bens", multiSummaryText("esc_pat_atuacao"))
  ]);
  if(COND.escopoB()) bloco(ESCOPOS[1], [
    L("Tipo de acompanhamento", multiSummaryText("esc_op_acoes")),
    L("Periodicidade", val("esc_op_periodicidade"))
  ]);
  if(COND.escopoC()) bloco(ESCOPOS[2], [
    L("Documentos e obrigações acompanhados", multiSummaryText("esc_doc_tipos")),
    L("Atuação sobre os documentos", multiSummaryText("esc_doc_atuacao"))
  ]);
  if(COND.escopoD()) bloco(ESCOPOS[3], [
    L("Papel nos relatórios e indicadores", val("esc_rel_papel")),
    L("Destinatários dos relatórios", multiSummaryText("esc_rel_destino"))
  ]);
  if(COND.escopoE()) bloco(ESCOPOS[4], [
    L("Conhecimentos declarados", multiSummaryText("req_conhecimentos")),
    L("Sistemas indicados", multiSummaryText("req_sistema")),
    L("Grau de exigência por conhecimento", classificacaoTecnicaTexto())
  ]);
  return out;
}
function escoposTexto(){
  var marcados = multiSummaryText("esc_escopos");
  if(!marcados) return "Escopos não informados pelo solicitante.";
  var det = escoposDeclarados().map(function(b){
    return b.titulo+" — "+b.linhas.map(function(l){ return l[0]+": "+l[1]; }).join("; ");
  }).join(". ");
  return "Escopos marcados: "+marcados+"."+(det?(" "+det+"."):"");
}

/* ============================= GESTOR — Etapa 12: síntese objetiva + confirmação final =============================
   Calculada a partir das respostas já dadas pelo próprio solicitante — nunca um texto que alguém
   escreve "sobre si mesmo"/"sobre a função" de forma livre (autorrelatada). O RH não participa
   desta etapa; ela substitui o antigo rascunho manual de síntese que o RH preenchia à mão. */
function computeSinteseObjetiva(){
