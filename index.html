function weightSum(){ var t=0; FATORES.forEach(function(f){ t+=Number(state.weights[f.id])||0; }); return t; }
/* Média ponderada das notas dos fatores, de 1 a 5.
   O peso de referência é o dos fatores EFETIVAMENTE PONTUADOS, não o dos seis. Dividir pelo total
   fixo fazia a avaliação parcial sair sistematicamente rebaixada — cinco fatores com nota 4
   apareciam como 3,40 em vez de 4,00 — e esse número vai para o resumo executivo do relatório,
   onde "incompleto" seria lido como "nota baixa". Avaliação completa dá exatamente o mesmo valor
   de antes; o que muda é só o caminho até ela. */
/* Como o número deve ser lido. Numa avaliação parcial ele é a média dos fatores JÁ pontuados —
   não uma nota baixa —, por isso o rótulo diz o que está coberto. */
function rotuloPontuacao(sc){
  if(sc.semPeso) return "Pontuação ponderada (pesos zerados — média simples de "+sc.answered+" de "+FATORES.length+" fatores)";
  if(sc.complete) return "Pontuação ponderada (6 de 6 fatores)";
  if(!sc.answered) return "Pontuação ponderada (nenhum fator avaliado ainda)";
  return "Pontuação ponderada dos fatores já avaliados ("+sc.answered+" de "+FATORES.length+" · "+sc.pesoRespondido+"% do peso)";
}
function computeScore(){
  var soma=0, pesoRespondido=0, answered=0, notas=[];
  FATORES.forEach(function(f){
    var s=state.scores[f.id], peso=Number(state.weights[f.id])||0;
    if(s && s.score){
      var nota=Number(s.score);
      soma += nota*peso; pesoRespondido += peso; notas.push(nota); answered++;
    }
  });
  var total;
  if(pesoRespondido > 0) total = soma/pesoRespondido;
  else if(notas.length) total = notas.reduce(function(a,b){return a+b;},0)/notas.length; // pesos zerados: média simples
  else total = 0;
  return {total:total, answered:answered, complete:answered===FATORES.length,
          pesoRespondido:pesoRespondido, semPeso:(answered>0 && pesoRespondido===0)};
}
function renderRHAvaliacao(){
  var wsum=weightSum();
  var factorsHtml = FATORES.map(function(f){
    var s=state.scores[f.id]||{};
    var dots=[1,2,3,4,5].map(function(n){ return '<label><input type="radio" name="score_'+f.id+'" data-score="'+f.id+'" value="'+n+'" '+(Number(s.score)===n?"checked":"")+'><span class="dot">'+n+'</span></label>'; }).join("");
    return (
      '<div class="factor">'+
        '<div class="factor-head"><h4>'+esc(f.nome)+'</h4><span class="factor-weight-edit">peso <input type="number" min="0" max="100" data-weight="'+f.id+'" value="'+(state.weights[f.id])+'">%</span></div>'+
        '<div class="factor-anchors">'+esc(f.anchors)+'</div>'+
        '<div class="scale5">'+dots+'</div>'+
        '<div class="field" style="margin-top:12px"><div class="field-head"><label class="lbl">Justificativa da nota</label></div><textarea class="textarea" data-score-note="'+f.id+'" style="min-height:52px" placeholder="Com base em quais respostas do gestor?">'+esc(s.note||"")+'</textarea></div>'+
      '</div>'
    );
  }).join("");
  var sc = computeScore();
  return (
    '<div class="lead-banner">Os pesos abaixo são uma metodologia interna proposta por esta análise, não um padrão oficial de mercado. O gestor não participa desta etapa.</div>'+
    factorsHtml+
    '<div class="weight-total '+(wsum===100?"ok":"bad")+'">Soma dos pesos: '+wsum+'% '+(wsum===100?"— ok":"— ajuste para somar 100%")+'</div>'+
    '<div class="score-total"><div><div class="k">'+esc(rotuloPontuacao(sc))+'</div></div><div class="v">'+sc.total.toFixed(2)+' / 5,00</div></div>'+
    '<div class="section-title">Enquadramento organizacional</div>'+
    '<div class="section-note">Atuação corporativa não significa, por si só, nível gerencial. Baseie o enquadramento na complexidade real, autonomia, responsabilidade e estrutura — não no título pretendido.</div>'+
    field("rh_enquadramento","Enquadramento sugerido","select",{options:["Operacional","Assistente","Analista","Especialista","Coordenação","Outro"]})+
    field("rh_enquadramentoJustificativa","Justificativa do enquadramento","textarea",{rows:3})+
    guiaRemuneracao()
  );
}

function renderTable(tableKey, cols, addLabel){

function marketStats(){
  var nums = state.tables.market.filter(function(r){return r.tipo==="Observado" && r.fixo && !isNaN(parseFloat(r.fixo));}).map(function(r){return parseFloat(r.fixo);}).sort(function(a,b){return a-b;});
  var n=nums.length; if(!n) return null;
  function pct(p){ var idx=(n-1)*p, lo=Math.floor(idx), hi=Math.ceil(idx); if(lo===hi) return nums[lo]; return nums[lo]+(nums[hi]-nums[lo])*(idx-lo); }
  return {n:n, min:nums[0], max:nums[n-1], q1:pct(.25), median:pct(.5), q3:pct(.75)};
}

function pendingListGestor(){
  var out=[];
  var naoSeiValues = ["Não sei informar","Ainda não definido","Abrangência ainda não definida","A definir","Ainda não definido ou liderança não definida","Não há necessidade identificada no momento"];
  Object.keys(state.values).forEach(function(k){
    if(naoSeiValues.indexOf(state.values[k])>=0) out.push(k);
  });
  Object.keys(state.unknown).forEach(function(k){ if(state.unknown[k]) out.push(k); });
  if(state.activities.naosei) out.push("ativ_naosei");
  return out;
}

function reportText(html){
  var div=document.createElement("div"); div.innerHTML=html; var lines=[];
  div.querySelectorAll("h1,h2,h3,p,li,td,th").forEach(function(n){
    var t=n.innerText.trim(); if(!t) return;
    if(n.tagName==="H1") lines.push("\n"+t.toUpperCase()+"\n"+"=".repeat(t.length));
    else if(n.tagName==="H2") lines.push("\n"+t.toUpperCase());
    else if(n.tagName==="H3") lines.push("\n"+t);
    else if(n.tagName==="LI") lines.push("• "+t);
    else lines.push(t);
  });
  return lines.join("\n");
}
/* ============================= exportação em Excel (função "Gerar relatório") =============================
   Gera um workbook .xlsx multi-abas (Resumo Executivo, Descrição do Cargo, Pesquisa Salarial, Custo do
   Cargo e Implementação/Recomendação), combinando o que foi preenchido nesta sessão com a pesquisa salarial
   de SALARY_BENCHMARKS_REF quando o cargo em análise corresponde a ela. Não altera o questionário, as etapas,
   as opções de resposta nem os Relatórios A/B já existentes — é uma saída adicional oferecida ao gerar os
   relatórios, seguindo como referência a estrutura do dossiê em Excel fornecido pelo Grupo Premium. */
var BRAND_GREEN = "FF1E7A4C", BRAND_GREEN_DARK = "FF135736";
var TINT_GOOD = "FFE2F1E8", TINT_WARN = "FFF5EAD9", TINT_PENDING = "FFF6E1DF", TINT_HEAD = "FFE9EFE9";
function xlTitleRow(ws, text){
  var row = ws.addRow(["", text]);
  row.getCell(2).font = {name:"Arial", bold:true, size:16, color:{argb:BRAND_GREEN_DARK}};
  row.height = 26;
  return row;
}
function xlSubRow(ws, text){
  var row = ws.addRow(["", text]);
  row.getCell(2).font = {name:"Arial", italic:true, size:11, color:{argb:"FF5B645C"}};
  return row;
}
function xlSectionRow(ws, text){
  ws.addRow([]);
  var row = ws.addRow(["", text]);
  row.getCell(2).font = {name:"Arial", bold:true, size:12.5, color:{argb:"FFFFFFFF"}};
  row.eachCell({includeEmpty:true}, function(cell, colNumber){ if(colNumber>=2){ cell.fill = {type:"pattern", pattern:"solid", fgColor:{argb:BRAND_GREEN}}; } });
  row.height = 20;
  return row;
}
function xlLabelValue(ws, label, value){
  var row = ws.addRow(["", label, value]);
  row.getCell(2).font = {name:"Arial", bold:true, size:10.5};
  row.getCell(3).font = {name:"Arial", size:10.5};
  row.getCell(3).alignment = {wrapText:true, vertical:"top"};
  return row;
}
function xlParagraph(ws, text, span){
  var row = ws.addRow(["", text]);
  row.getCell(2).font = {name:"Arial", size:10.5};
  row.getCell(2).alignment = {wrapText:true, vertical:"top"};
  ws.mergeCells(row.number, 2, row.number, span||6);
  row.height = Math.max(18, Math.ceil((text||"").length/90)*14);
  return row;
}
function xlTag(status){
  if(status==="verificado") return {text:"VERIFICADO", argb:TINT_GOOD, font:"FF135736"};
  if(status==="estimativa") return {text:"ESTIMATIVA", argb:TINT_WARN, font:"FFA6651F"};
  return {text:"PENDENTE DE VALIDAÇÃO", argb:TINT_PENDING, font:"FFA33636"};
}
function xlApplyTag(cell, status){
  var tag = xlTag(status);
  cell.value = tag.text;
  cell.font = {name:"Arial", bold:true, size:9, color:{argb:tag.font}};
  cell.fill = {type:"pattern", pattern:"solid", fgColor:{argb:tag.argb}};
  cell.alignment = {horizontal:"center", vertical:"middle"};
  return tag;
}

async function buildExcelWorkbook(){
  var wb = new ExcelJS.Workbook();
  wb.creator = "Premium | Inteligência de Cargos e Remuneração";
  wb.created = new Date();
  var cargo = val("ident_cargo") || "Cargo em análise";
  var today = new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"});
  var sc = computeScore();
  var usaBenchmarkRef = cargoCombinaComBenchmarkRef();

  /* ---------- Resumo Executivo ---------- */
  var ws1 = wb.addWorksheet("Resumo Executivo", {views:[{showGridLines:false}]});
  ws1.columns = [{width:2},{width:36},{width:70},{width:20}];
  xlTitleRow(ws1, "RESUMO EXECUTIVO");
  xlSubRow(ws1, cargo+" — Grupo Premium · gerado em "+today);
  ws1.addRow([]);
  xlLabelValue(ws1, "Cargo proposto", cargo);
  xlLabelValue(ws1, "Nível / enquadramento sugerido", val("rh_enquadramento")||"a definir pelo RH");
  xlLabelValue(ws1, "Unidade(s) de atuação", multiSummaryText("ident_unidades")||"não informado");
  xlLabelValue(ws1, "Tipo de solicitação", val("ident_tipo")||"não informado");
  ws1.addRow([]);
  var faixaTxt = (val("rh_faixaMin")&&val("rh_faixaMax")) ? (fmtMoney(val("rh_faixaMin"))+" – "+fmtMoney(val("rh_faixaMax"))+(val("rh_faixaMedio")?(" (médio "+fmtMoney(val("rh_faixaMedio"))+")"):"")) : "a definir — evidências insuficientes (ver aba Pesquisa Salarial)";
  var faixaRow = xlLabelValue(ws1, "Faixa salarial mensal recomendada", faixaTxt);
  xlApplyTag(faixaRow.getCell(4), (state.values.rh_salario_pendente==="1"||!val("rh_faixaMin")) ? "pendente" : "verificado");
  xlLabelValue(ws1, "Recomendação final do RH", val("rh_recomendacao")||"a definir");
  xlLabelValue(ws1, "Pontuação técnica ponderada (metodologia interna)", sc.total.toFixed(2)+" / 5,00"+(sc.complete?" (6 de 6 fatores)":" — parcial: "+sc.answered+" de "+FATORES.length+" fatores, "+sc.pesoRespondido+"% do peso"));
  ws1.addRow([]);
  xlSectionRow(ws1, "Análise técnica e personalizada do cargo");
  xlParagraph(ws1, buildExecutiveNarrative());
  ws1.addRow([]);
  xlSectionRow(ws1, "Por que criar este cargo agora");
  xlParagraph(ws1, "Motivos declarados pelo gestor: "+(multiSummaryText("nec_motivos")||"não informado")+".");
  if(val("nec_problema")) xlParagraph(ws1, "Problema a resolver: "+val("nec_problema"));
  xlParagraph(ws1, "Consequência de não criar/preencher a vaga: "+(multiSummaryText("nec_impacto")||"não informado")+".");
  ws1.addRow([]);
  xlSectionRow(ws1, "Pontos pendentes de validação");
  var pend = pendingListGestor();
  xlParagraph(ws1, pend.length ? (pend.length+" informação(ões) ainda marcadas como \"não sei informar\" ou \"ainda não definido\" pelo gestor — ver detalhamento nos Relatórios A e B.") : "Nenhum ponto pendente sinalizado pelo gestor nesta sessão.");
  if(val("rh_riscosPendencias")) xlParagraph(ws1, "Riscos e pendências apontados pelo RH: "+val("rh_riscosPendencias"));

  /* ---------- Descrição do Cargo ---------- */
  var ws2 = wb.addWorksheet("Descrição do Cargo", {views:[{showGridLines:false}]});
  ws2.columns = [{width:2},{width:36},{width:85}];
  xlTitleRow(ws2, "DESCRIÇÃO DO CARGO");
  xlSubRow(ws2, cargo);
  ws2.addRow([]);
  xlLabelValue(ws2, "Missão do cargo", val("rh_missao")||"não informado");
  xlLabelValue(ws2, "Descrição consolidada das responsabilidades", val("rh_descricaoConsolidada")||"não informado");
  xlLabelValue(ws2, "Requisitos finais", val("rh_requisitosFinal")||"não informado");
  xlLabelValue(ws2, "Escolaridade declarada pelo gestor", val("req_escolaridade")||"não informada");
  xlLabelValue(ws2, "Experiência declarada pelo gestor", val("req_experiencia")||"não informada");
  xlLabelValue(ws2, "Conhecimentos necessários", multiSummaryText("req_conhecimentos")||"não informados");
  if(classificacaoTecnicaTexto()){
    xlLabelValue(ws2, "Conhecimentos obrigatórios (declarado pelo gestor)", classificacaoTecnicaPor("Obrigatório").join("; ")||"nenhum classificado");
    xlLabelValue(ws2, "Conhecimentos desejáveis (declarado pelo gestor)", classificacaoTecnicaPor("Desejável").join("; ")||"nenhum classificado");
    xlLabelValue(ws2, "Conhecimentos não aplicáveis (declarado pelo gestor)", classificacaoTecnicaPor("Não aplicável").join("; ")||"nenhum classificado");
  }
  xlLabelValue(ws2, "Autonomia e limites de decisão", val("rh_autonomiaLimites")||"não informado");
  xlLabelValue(ws2, "Liderança", val("rh_liderancaAnalise")||"não informado");
  xlLabelValue(ws2, "Abrangência e interfaces", val("rh_abrangenciaInterfaces")||"não informado");
  xlLabelValue(ws2, "Responsabilidade sobre ativos/consignação/documentos", val("rh_responsabilidadeAtivos")||"não informado");
  xlLabelValue(ws2, "Escopos de controle marcados pelo gestor", multiSummaryText("esc_escopos")||"não informados");
  escoposDeclarados().forEach(function(b){
    xlLabelValue(ws2, "Escopo — "+b.titulo, b.linhas.map(function(l){ return l[0]+": "+l[1]; }).join("\n"));
  });
  if(sobreposicaoAreasTexto()){
    xlLabelValue(ws2, "Limite entre áreas — validação pendente do RH", sobreposicaoAreasTexto());
  }
  xlLabelValue(ws2, "Digitalização e melhoria contínua", val("rh_digitalizacaoMelhoria")||"não informado");
  if(usaBenchmarkRef){
    xlLabelValue(ws2, "CBO de referência (mais próximo)", "2527-15 — Analista de Logística; 4102-20 — Supervisor/Encarregado de Controle Patrimonial; elementos de 4141-05 — Almoxarife/Conferente de Mercadoria (consignação). Sugestão com base em cargos de mercado equivalentes — a confirmar pelo RH.");
  }
  ws2.addRow([]);
  xlSectionRow(ws2, "Responsabilidades por grupo de atividades (selecionadas pelo gestor)");
  activityBreakdown().forEach(function(b){
    if(!b.n) return;
    var grupo = state.catalog.filter(function(g){return g.id===b.id;})[0];
    var itens = grupo ? grupo.itens.filter(function(_,i){return state.activities[grupo.id+i];}) : [];
    xlLabelValue(ws2, b.id+". "+b.nome+" ("+b.n+"/"+b.total+")", itens.map(function(t){return "• "+t;}).join("\n"));
  });

  /* ---------- Pesquisa Salarial ---------- */
  var ws3 = wb.addWorksheet("Pesquisa Salarial", {views:[{showGridLines:false}]});
  ws3.columns = [{width:2},{width:20},{width:34},{width:10},{width:12},{width:13},{width:13},{width:38}];
  xlTitleRow(ws3, "PESQUISA SALARIAL DE MERCADO");
  xlSubRow(ws3, cargo+" — fontes consultadas: Indeed, Catho, Glassdoor, LinkedIn, Netvagas e CareerJet");
  ws3.addRow([]);
  xlLabelValue(ws3, "Região considerada", val("rh_salario_regiao")||SALARY_BENCHMARKS_REF.regiaoBase);
  xlLabelValue(ws3, "Empresas/segmento comparável", val("rh_salario_empresas")||"não informado pelo RH");

  xlSectionRow(ws3, "Evidências registradas pelo RH nesta sessão");
  var rhHead = ws3.addRow(["", "Fonte", "Cargo comparado", "Data", "Tipo", "Fixo (R$)", "Benefícios", "Metodologia / link"]);
  rhHead.eachCell({includeEmpty:true}, function(c,n){ if(n>=2){ c.font={name:"Arial",bold:true,size:9.5}; c.fill={type:"pattern",pattern:"solid",fgColor:{argb:TINT_HEAD}}; } });
  var rhRows = state.tables.market.filter(function(r){ return r.fonte||r.cargoComp||r.fixo; });
  if(rhRows.length){
    rhRows.forEach(function(r){
      var row = ws3.addRow(["", r.fonte||"", r.cargoComp||"", r.data||"", r.tipo||"", r.fixo?Number(r.fixo):null, r.beneficios||"", r.metodologia||""]);
      if(r.fixo) row.getCell(6).numFmt = "R$ #,##0.00";
      row.getCell(8).alignment = {wrapText:true};
    });
  } else {
    xlParagraph(ws3, "Nenhuma evidência registrada pelo RH nesta sessão ainda.", 8);
  }

  if(usaBenchmarkRef){
    xlSectionRow(ws3, "Benchmarks de mercado consultados (pesquisa adicional desta atualização)");
    xlParagraph(ws3, SALARY_BENCHMARKS_REF.fonteResumo, 8);
    var refHead = ws3.addRow(["", "Fonte", "Cargo comparado", "Data", "Tipo", "Fixo (R$)", "Benefícios", "Metodologia / link"]);
    refHead.eachCell({includeEmpty:true}, function(c,n){ if(n>=2){ c.font={name:"Arial",bold:true,size:9.5}; c.fill={type:"pattern",pattern:"solid",fgColor:{argb:TINT_HEAD}}; } });
    var refFixed = [];
    SALARY_BENCHMARKS_REF.linhas.forEach(function(r){
      var row = ws3.addRow(["", r[0], r[1], r[2], r[3], r[4], r[5], r[7]]);
      row.getCell(6).numFmt = "R$ #,##0.00";
      row.getCell(8).alignment = {wrapText:true};
      xlApplyTag(row.getCell(5), r[3]==="Observado"?"verificado":"estimativa");
      if(r[3]==="Observado") refFixed.push(r[4]);
    });
    var refStats = statsFromFixedValues(refFixed);
    if(refStats){
      ws3.addRow([]);
      xlLabelValue(ws3, "Faixa de mercado (benchmarks acima, observados)", fmtMoney(refStats.min)+" – "+fmtMoney(refStats.max)+" (mediana "+fmtMoney(refStats.median)+", n="+refStats.n+")");
    }
    ws3.addRow([]);
    xlSectionRow(ws3, "Fontes adicionais consultadas sem dado público disponível ("+SALARY_BENCHMARKS_REF.consultadoEm+")");
    SALARY_BENCHMARKS_REF.semDadoPublico.forEach(function(s){
      xlLabelValue(ws3, s[0], s[1]);
    });
  } else {
    xlSectionRow(ws3, "Pesquisa de mercado pré-carregada");
    xlParagraph(ws3, "Esta sessão está investigando um cargo diferente de \"Controlador(a) de Ativos e Consignação\" — a pesquisa de mercado pré-carregada (salario.com.br, vagas.com.br, Catho, Indeed, Glassdoor) não se aplica automaticamente. Utilize a tabela de evidências registradas pelo RH acima ou realize nova pesquisa específica para este cargo em Indeed, Catho, Glassdoor, LinkedIn, Netvagas e CareerJet.", 8);
  }

  ws3.addRow([]);
  xlSectionRow(ws3, "Faixa salarial recomendada");
  xlLabelValue(ws3, "Mínima", val("rh_faixaMin")?fmtMoney(val("rh_faixaMin")):"a definir");
  xlLabelValue(ws3, "Ponto médio", val("rh_faixaMedio")?fmtMoney(val("rh_faixaMedio")):"a definir");
  xlLabelValue(ws3, "Máxima", val("rh_faixaMax")?fmtMoney(val("rh_faixaMax")):"a definir");
  xlLabelValue(ws3, "Recomendado para contratação", val("rh_salarioRecomendado")?fmtMoney(val("rh_salarioRecomendado")):"a definir");
  var confRow = xlLabelValue(ws3, "Grau de confiança da recomendação", val("rh_grauConfianca")||"não definido");
  xlApplyTag(confRow.getCell(4), val("rh_grauConfianca")==="Alto" ? "verificado" : ((!val("rh_grauConfianca")||val("rh_grauConfianca")==="Baixo"||state.values.rh_salario_pendente==="1") ? "pendente" : "estimativa"));
  if(val("rh_salario_justificativa")) xlParagraph(ws3, "Justificativa técnica: "+val("rh_salario_justificativa"), 8);
  if(val("rh_salario_premissas")) xlParagraph(ws3, "Premissas utilizadas: "+val("rh_salario_premissas"), 8);

  /* ---------- Custo do Cargo ---------- */
  var ws4 = wb.addWorksheet("Custo do Cargo", {views:[{showGridLines:false}]});
  ws4.columns = [{width:2},{width:44},{width:16},{width:16},{width:16}];
  xlTitleRow(ws4, "CUSTO DO CARGO (ESTIMATIVA)");
  xlSubRow(ws4, cargo+" — valores mensais, regime CLT 44h, salvo indicação em contrário");
  ws4.addRow([]);
  var piso = Number(val("rh_faixaMin"))||null, medio = Number(val("rh_faixaMedio"))||null, teto = Number(val("rh_faixaMax"))||null;
  if(piso||medio||teto){
    var custoHead = ws4.addRow(["", "Item", "Piso", "Médio", "Teto"]);
    custoHead.eachCell({includeEmpty:true}, function(c,n){ if(n>=2){ c.font={name:"Arial",bold:true,size:9.5}; c.fill={type:"pattern",pattern:"solid",fgColor:{argb:TINT_HEAD}}; } });
    function addMoneyRow(label, vPiso, vMedio, vTeto, boldv){
      var row = ws4.addRow(["", label, vPiso, vMedio, vTeto]);
      [3,4,5].forEach(function(i){ row.getCell(i).numFmt = "R$ #,##0.00"; if(boldv) row.getCell(i).font={name:"Arial",bold:true,size:10}; });
      return row;
    }
    addMoneyRow("Salário base mensal (R$)", piso, medio, teto);
    var encPiso = piso?piso*totalEncargosPerc():null, encMedio = medio?medio*totalEncargosPerc():null, encTeto = teto?teto*totalEncargosPerc():null;
    addMoneyRow("Encargos sociais CLT — estimativa padrão ("+(totalEncargosPerc()*100).toFixed(2)+"%)", encPiso, encMedio, encTeto);
    ws4.addRow(["", "Benefícios mensais (R$)", "a confirmar", "a confirmar", "a confirmar"]);
    var custoPiso = piso?custoMensalEmpresa(piso,0):null, custoMedio = medio?custoMensalEmpresa(medio,0):null, custoTeto = teto?custoMensalEmpresa(teto,0):null;
    addMoneyRow("Custo mensal total por colaborador (sem benefícios — R$)", custoPiso, custoMedio, custoTeto, true);
    addMoneyRow("Custo anual total estimado (sem benefícios — R$)", custoPiso?custoPiso*12:null, custoMedio?custoMedio*12:null, custoTeto?custoTeto*12:null, true);
    ws4.addRow([]);
    xlParagraph(ws4, "Observação: estimativa para fins de orçamento e apresentação à Diretoria, com a mesma metodologia de encargos (INSS patronal 20% + RAT/SAT 2% + Sistema S 5,8% + FGTS 8% + 13º 8,33% + férias+1/3 11,11% + provisão rescisória 4% = "+(totalEncargosPerc()*100).toFixed(2)+"% sobre o salário base) já utilizada na pesquisa fornecida pelo Grupo Premium. Benefícios mensais não foram informados nesta sessão — inclua-os para um custo total mais preciso. Não substitui o cálculo oficial da contabilidade/departamento pessoal.", 5);
  } else {
    xlParagraph(ws4, "Faixa salarial ainda não definida na etapa de Pesquisa Salarial do RH — preencha os campos Mínima/Ponto médio/Máxima para que esta aba calcule o custo estimado do cargo automaticamente.", 5);
  }

  /* ---------- Implementação e Recomendação ---------- */
  var ws5 = wb.addWorksheet("Implementação e Recomendação", {views:[{showGridLines:false}]});
  ws5.columns = [{width:2},{width:36},{width:85}];
  xlTitleRow(ws5, "RECOMENDAÇÃO E PLANO DE IMPLEMENTAÇÃO");
  xlSubRow(ws5, cargo);
  ws5.addRow([]);
  var recRow = xlLabelValue(ws5, "Recomendação final do RH", val("rh_recomendacao")||"a definir");
  xlApplyTag(recRow.getCell(4), val("rh_recomendacao")==="Aprovar" ? "verificado" : ((!val("rh_recomendacao")||val("rh_recomendacao")==="Aguardar informações complementares") ? "pendente" : "estimativa"));
  xlLabelValue(ws5, "Justificativa da recomendação", val("rh_recomendacaoJustificativa")||"não preenchida");
  xlLabelValue(ws5, "Riscos e informações pendentes", val("rh_riscosPendencias")||"não preenchido");
  ws5.addRow([]);
  xlSectionRow(ws5, "Próximos passos sugeridos");
  ["Validar nome do cargo, nível e faixa salarial com a Diretoria", "Confirmar convenção coletiva de trabalho (CCT) aplicável em cada unidade", "Formalizar a descrição de cargo aprovada no documento interno de cargos e salários", "Abrir o processo seletivo com base nos requisitos definidos", "Contratar e integrar o(a) profissional"].forEach(function(step,i){
    ws5.addRow(["", (i+1)+". "+step]);
  });
  ws5.addRow([]);
  xlSectionRow(ws5, "Indicadores de desempenho sugeridos (KPIs)");
  xlLabelValue(ws5, "Indicadores sugeridos pelo gestor", multiSummaryText("ind_sugestoes")||"não informados");
  xlLabelValue(ws5, "Indicadores de desempenho (síntese objetiva)", val("rh_indicadoresFinal")||"não preenchido");
  if(val("ind_meta")) xlLabelValue(ws5, "Meta", val("ind_meta"));
  if(val("ind_frequencia")) xlLabelValue(ws5, "Frequência de acompanhamento", val("ind_frequencia"));
  if(val("ind_fonte")) xlLabelValue(ws5, "Fonte dos dados", val("ind_fonte"));

  return wb;
}

async function downloadExcelReport(){
  var btn = document.getElementById("btn-export-excel");
  var toastX=document.getElementById("copy-toast");
  function toast(msg,dur){ toastX.textContent=msg; toastX.classList.add("show"); setTimeout(function(){toastX.classList.remove("show");},dur||3500); }
  if(typeof ExcelJS === "undefined"){
    toast("Não foi possível carregar o gerador de Excel (sem conexão). Tente novamente.",3000);
    return;
  }
  if(btn){ btn.disabled=true; btn.textContent="Gerando Excel…"; }
  try{
    var wb = await buildExcelWorkbook();
    var buffer = await wb.xlsx.writeBuffer();
    var blob = new Blob([buffer], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var slug = (val("ident_cargo")||"cargo").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_+|_+$/g,"");
    var filename = "Relatorio_Premium_"+(slug||"cargo")+".xlsx";
    var downloads = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
    if(downloads){
      await downloads.save({filename:filename, data:blob});
    } else {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    }
  } catch(err){
    if(err && err.code==="declined"){
      toast("Download cancelado.",2000);
    } else {
      toast("Erro ao gerar o Excel: "+(err&&err.message?err.message:"tente novamente."),3500);
    }
  } finally {
    if(btn){ btn.disabled=false; btn.textContent="📊 Baixar relatório completo (Excel)"; }
  }
}

function ncField(id,label,type,opts){
  opts=opts||{};
  state._novaForm = state._novaForm||{};
  var v = state._novaForm[id]||"";
  return '<div class="field"><div class="field-head"><label class="lbl">'+label+(opts.required?' <span class="req">*</span>':'')+'</label></div>'+
    '<input class="input" type="'+(type==="date"?"date":"text")+'" data-nova-field="'+id+'" value="'+esc(v)+'" placeholder="'+esc(opts.placeholder||"")+'"></div>';
}

/* Tela final do arquivo do gestor: o código que ele devolve ao RH. Sem conta e sem internet, este

   texto ou baixar o arquivo) e o aviso de não fechar antes de enviar. */
function gerarCodigoResposta(){
  state.gestorConfirmed = true;
  scheduleSave();
  state.codigoErro = null;
  montarCodigoResposta().then(function(cod){
    state.codigoResposta = cod; state.view = "codigo-resposta"; render();
  }).catch(function(e){
    state.codigoErro = (e && e.message) || "erro";

/* Importação, no painel, do código que o gestor devolveu. Grava as respostas no registro certo e
   leva a solicitação para "concluída", exatamente como se tivesse sido preenchida por link. */
function importarRespostaDoGestor(id){
  var ta = document.getElementById("importar-codigo");
  var texto = (ta && ta.value) || state.importarTexto || "";
  state.importarErro = null;
  if(!texto.trim()){ state.importarErro = "Cole o código enviado pelo gestor, ou escolha o arquivo de resposta."; render(); return; }
  if(!portalDb){ state.importarErro = "O banco de dados do portal não está disponível nesta sessão."; render(); return; }
  lerCodigoResposta(texto).then(function(dados){
    if(dados.id && dados.id !== id){
      throw new Error("Este código pertence a outra solicitação (" + dados.id + "). Importe-o na solicitação correta para não misturar respostas.");
    }
    return reqDocRef(id).get().then(function(snap){
      if(!snap.exists) throw new Error("A solicitação não foi encontrada no portal.");
      var atual = reqFromSnap(snap);
      var d = cloneSnapshotData(atual.data) || {};
      d.values = dados.values || {};
      d.multi = dados.multi || {};
      d.unknown = dados.unknown || {};
      d.activities = dados.activities || {};
      d.gestorConfirmed = true;
      d.gStep = GESTOR_STEPS.length - 1;
      if(!d.tables) d.tables = {market:[], equity:[]};
      if(!d.scores) d.scores = {};
      if(!d.weights || !Object.keys(d.weights).length) d.weights = defaultWeights();
      if(typeof d.reportVersion !== "number") d.reportVersion = 0;
      if(typeof d.rStep !== "number") d.rStep = 0;
      return reqDocRef(id).update({data:d, updatedAt:new Date().toISOString()}).then(function(){
        return setReqStatus(id, REQ_STATUS.CONCLUIDA, "Respostas do gestor importadas pelo RH (código de resposta).");
      });
    });
  }).then(function(){
    state.importarId = null; state.importarTexto = ""; state.importarErro = null;
    state.importarOk = "Respostas importadas. A solicitação está pronta para a avaliação técnica.";
    render();
  }).catch(function(err){
    state.importarErro = (err && err.message) || "Não foi possível importar este código.";
    render();
  });
}

    html = shellHeaderPlain("Relatórios", "Gerados a partir das respostas registradas") +
      '<main class="wrap"><div class="card">'+renderReports()+'</div></main>';
  } else if(state.view==="painel"){
    html = shellApp("Painel do RH", "Inteligência de Cargos e Remuneração", renderPainel());
  } else if(state.view==="nova"){
    html = shellApp("Nova solicitação", "Inteligência de Cargos e Remuneração",
      '<div class="card" style="max-width:820px">'+renderNovaSolicitacao()+'</div>');
  } else if(state.view==="detalhe"){
    html = shellApp("Detalhe da solicitação", "Inteligência de Cargos e Remuneração",
      '<div class="card" style="max-width:900px">'+renderDetalhe()+'</div>');
  } else if(state.view==="link-invalido"){
    html = renderLinkInvalido();
    document.title="Link indisponível";
  } else if(state.view==="codigo-resposta"){
    html = shellHeaderPlain("Respostas concluídas","Grupo Premium · RH") +
      '<main class="wrap"><div class="card">'+renderCodigoResposta()+'</div></main>';
    document.title="Código de resposta";
  } else if(state.view==="solicitante-status"){
    html = renderSolicitanteStatus();
    document.title="Solicitação enviada";
  }
  app.innerHTML = html;
  if(state.view==="gestor" || state.view==="rh") buildMapPanel();
  var scrollKeyNow = scrollKeyAtual();
  if(scrollKeyNow !== __lastScrollKey){ window.scrollTo({top:0}); }
  __lastScrollKey = scrollKeyNow;
}

function footerBar(role, i, total){
  var isLast = i===total-1;
  var backDisabled = i===0;
  var nextHtml = isLast ? '' : '<button type="button" class="btn '+(role==="gestor"?"btn-accent":"btn-rh")+'" id="btn-next">Continuar →</button>';
  return (
    '<footer class="bar"><div class="bar-inner">'+
      '<button type="button" class="btn btn-ghost" id="btn-back" '+(backDisabled?"disabled":"")+'>← Voltar</button>'+
      '<span class="bar-center">'+(isLast?"use o botão acima para continuar":"")+'</span>'+
      nextHtml+
    '</div></footer>'
  );
}

function buildMapPanel(){
  var mb=document.getElementById("map-body"); if(!mb) return;
  var html = '<div class="map-section-title">Gestor — solicitação</div><div class="map-grid">'+GESTOR_STEPS.map(function(s,i){
    var cur = state.view==="gestor" && state.gStep===i;
    var done = state.view==="rh" || state.view==="reports" || state.view==="catalog" || (state.view==="gestor" && i<state.gStep);
    return '<button type="button" class="map-item'+(cur?" current":"")+(done?" done":"")+'" data-goto-g="'+i+'"><span class="num">'+(done&&!cur?"✓":i+1)+'</span><span class="txt"><b>'+esc(s.titulo)+'</b></span></button>';
  }).join("")+'</div>';
  if(state.gestorConfirmed && canUseRHArea()){
    html += '<div class="map-section-title">RH — análise técnica</div><div class="map-grid">'+RH_STEPS.map(function(s,i){
      var cur = state.view==="rh" && state.rStep===i;
      var done = state.view==="reports" || (state.view==="rh" && i<state.rStep);
      return '<button type="button" class="map-item'+(cur?" current":"")+(done?" done":"")+'" data-goto-r="'+i+'"><span class="num">'+(done&&!cur?"✓":i+1)+'</span><span class="txt"><b>'+esc(s.titulo)+'</b></span></button>';
    }).join("")+'</div>';
  }
  mb.innerHTML = html;
}

/* ============================= navegação ============================= */
function goHome(){ enteredByLink=false; forgetNovaScreen(); portalActionError=null; state.reqId=null; state.reqMeta=null; state.view="home"; scheduleSave(); render(); }
/* validação de campos obrigatórios por etapa do gestor (item 4 do prompt mestre) */
var REQUIRED_BY_GSTEP = {
  0:[["ident_nome","text","Nome do solicitante"],["ident_unidades","multi","Em qual unidade o cargo atuará?"],["ident_tipo","single","Qual é o tipo de solicitação?"]],
  1:[["nec_motivos","multi","Qual é o principal motivo da solicitação?"]],
  5:[["cx_divergencias","single","A função precisará tratar divergências, perdas, atrasos ou inconsistências?"]],
  10:[["rev_confirma","single","Você confirma que as respostas representam a necessidade real da área?"]]
};
function missingRequired(gStep){
  var reqs = REQUIRED_BY_GSTEP[gStep]||[];
  var missing=[];
  reqs.forEach(function(r){
    var id=r[0], type=r[1], label=r[2], quando=r[3], ok;
    if(quando && !COND[quando]()) return; // pergunta oculta não é pendência

    if(type==="multi") ok = Object.keys(state.multi[id]||{}).some(function(k){return state.multi[id][k];});
    else ok = !!val(id);
    if(!ok) missing.push(label);
  });
  return missing;
}
function errorBanner(){
  if(!state.formError || !state.formError.length) return "";
  return '<div class="lead-banner" style="background:var(--pending-tint); color:var(--pending); border-color:var(--pending)">'+
    '<b>Antes de continuar, preencha:</b><ul style="margin:6px 0 0 18px; padding:0">'+
    state.formError.map(function(m){return '<li>'+esc(m)+'</li>';}).join("")+
    '</ul></div>';
}
function goGestor(i){ state.formError=null; state.view="gestor"; state.gStep=Math.max(0,Math.min(GESTOR_STEPS.length-1,i)); scheduleSave(); render(); }
function goRH(i){
  if(!canUseRHArea()){ state.view="gestor"; render(); return; } // solicitante nunca entra na área do RH
  if(!state.gestorConfirmed){ goGestor(GESTOR_STEPS.length-1); return; }
  state.view="rh"; state.rStep=Math.max(0,Math.min(RH_STEPS.length-1,i)); scheduleSave(); render();
}

document.addEventListener("change", function(e){
  var t=e.target;
  if(t && t.id==="importar-arquivo" && t.files && t.files[0]){
    var leitor = new FileReader();
    leitor.onload = function(){
      var ta = document.getElementById("importar-codigo");
      if(ta){ ta.value = String(leitor.result||"").trim(); state.importarTexto = ta.value; }
    };
    leitor.readAsText(t.files[0]);
  }
});
document.addEventListener("input", function(e){
  var t=e.target;
  if(state.view==="gestor") markReqStarted();
  if(t.dataset.field!==undefined){ state.values[t.dataset.field]=t.value; scheduleSave(); }
  else if(t.dataset.table!==undefined && t.tagName!=="SELECT"){ state.tables[t.dataset.table][Number(t.dataset.row)][t.dataset.col]=t.value; scheduleSave(); if(t.dataset.table==="market") refreshIf("rh",2); }
  else if(t.dataset.scoreNote!==undefined){ var fid=t.dataset.scoreNote; state.scores[fid]=state.scores[fid]||{}; state.scores[fid].note=t.value; scheduleSave(); }
  else if(t.dataset.weight!==undefined){ state.weights[t.dataset.weight]=Number(t.value)||0; scheduleSave(); updateWeightUIInPlace(); }
  else if(t.dataset.catItems!==undefined){ /* saved on click */ }
  else if(t.dataset.novaField!==undefined){ state._novaForm=state._novaForm||{}; state._novaForm[t.dataset.novaField]=t.value; }
  else if(t.id==="pub-url"){ state.pubUrlDraft=t.value; }
  else if(t.id==="painel-search"){ portalPainelSearch=t.value; portalPainelPagina=1; schedulePainelSearchRender(); }
});
document.addEventListener("change", function(e){
  var t=e.target;
  if(state.view==="gestor") markReqStarted();
  if(t.id==="painel-filter-status"){ portalPainelFilterStatus=t.value; portalPainelPagina=1; render(); return; }
  if(t.id==="painel-filter-unidade"){ portalPainelFilterUnidade=t.value; portalPainelPagina=1; render(); return; }
  if(t.id==="painel-filter-prazo"){ portalPainelFilterPrazo=t.value; portalPainelPagina=1; render(); return; }
  if(t.id==="painel-filter-resp"){ portalPainelFilterResp=t.value; portalPainelPagina=1; render(); return; }
  if(t.dataset.field!==undefined && t.tagName==="SELECT"){ state.values[t.dataset.field]=t.value; scheduleSave(); render(); return; }
  if(t.dataset.choice!==undefined){ state.values[t.dataset.choice]=t.value; scheduleSave(); render(); return; }
  if(t.dataset.multi!==undefined){ var k=t.dataset.multi, o=t.dataset.opt; state.multi[k]=state.multi[k]||{}; state.multi[k][o]=t.checked; scheduleSave(); render(); return; }
  if(t.dataset.unknown!==undefined){ state.unknown[t.dataset.unknown]=t.checked; scheduleSave(); render(); return; }
  if(t.dataset.activity!==undefined){ state.activities[t.dataset.activity]=t.checked; scheduleSave(); render(); return; }
  /* Nota de um fator da avaliação técnica. Sem este tratamento as notas eram marcadas na tela mas
     nunca gravadas, e a pontuação ponderada saía 0,00 em todo relatório. Atualiza o placar no lugar
     em vez de redesenhar, para não tirar o foco de quem está pontuando. */
  if(t.dataset.score!==undefined){
    var fid=t.dataset.score;
    state.scores[fid]=state.scores[fid]||{};
    state.scores[fid].score=Number(t.value)||null;
    scheduleSave(); updateWeightUIInPlace(); return;
  }
  if(t.dataset.table!==undefined && t.tagName==="SELECT"){ state.tables[t.dataset.table][Number(t.dataset.row)][t.dataset.col]=t.value; scheduleSave(); if(t.dataset.table==="market") render(); return; }
  if(t.dataset.fieldCheck!==undefined){ state.values[t.dataset.fieldCheck]=t.checked?"1":"0"; scheduleSave(); return; }
});
function updateWeightUIInPlace(){
  var wsum=weightSum(); var el=document.querySelector(".weight-total");
  if(el){ el.className="weight-total "+(wsum===100?"ok":"bad"); el.textContent="Soma dos pesos: "+wsum+"% "+(wsum===100?"— ok":"— ajuste para somar 100%"); }
  var sc=computeScore(); var v=document.querySelector(".score-total .v"), k=document.querySelector(".score-total .k");
  if(v) v.textContent=sc.total.toFixed(2)+" / 5,00";
  if(k) k.textContent=rotuloPontuacao(sc);
}
function refreshIf(view, step){ if(state.view===view && ((view==="gestor"&&state.gStep===step)||(view==="rh"&&state.rStep===step))) render(); }

document.addEventListener("click", function(e){

  if((el=e.target.closest("#btn-confirm-gestor"))){

  if((el=e.target.closest("[data-tab]"))){ state.reportTab=el.dataset.tab; render(); return; }
  if((el=e.target.closest("#btn-copy-report"))){

    var text = reportText(html);
    var toast=document.getElementById("copy-toast");

    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){flash("Relatório "+state.reportTab+" copiado.");}).catch(function(){fallbackCopy(text,flash);}); }
    else fallbackCopy(text,flash);
    return;
  }
  if((el=e.target.closest("[data-add-row]"))){ var tk=el.dataset.addRow; state.tables[tk].push(blankRow(tk==="market"?MARKET_COLS:EQUITY_COLS)); scheduleSave(); render(); return; }
  if((el=e.target.closest("[data-remove-row]"))){ var tk2=el.dataset.removeRow, idx=Number(el.dataset.row); state.tables[tk2].splice(idx,1); if(!state.tables[tk2].length) state.tables[tk2].push(blankRow(tk2==="market"?MARKET_COLS:EQUITY_COLS)); scheduleSave(); render(); return; }
  if((el=e.target.closest("#btn-save-catalog"))){
    var names=document.querySelectorAll("[data-cat-name]"), items=document.querySelectorAll("[data-cat-items]");
    var newCat = state.catalog.map(function(g,gi){
      var nameRaw = names[gi].value.trim();
      var m = nameRaw.match(/^([A-Za-z])\.\s*(.*)$/);
      var itens = items[gi].value.split("\n").map(function(s){return s.trim();}).filter(Boolean);
      return {id: m?m[1]:g.id, nome: m?m[2]:nameRaw, itens: itens};
    });
    state.catalog = newCat; scheduleSave();
    var toast2=document.getElementById("copy-toast"); toast2.textContent="Catálogo salvo."; toast2.classList.add("show"); setTimeout(function(){toast2.classList.remove("show");},2000);

  /* ------- portal RH: painel / nova solicitação / detalhe ------- */
  /* ---- arquivo do gestor: tela do código de resposta ---- */
  if((el=e.target.closest("#btn-start"))){
    if(!modoQuestionario) return;                 // fora do arquivo do gestor não há questionário solto

    state.view="gestor"; scheduleSave(); render(); return;
  }
  if((el=e.target.closest("#btn-baixar-codigo"))){ baixarArquivoResposta(); return; }
  if((el=e.target.closest("#btn-voltar-questionario"))){ state.view="gestor"; state.gStep=GESTOR_STEPS.length-1; render(); return; }
  /* ---- painel do RH: gerar o arquivo do questionário e importar a resposta ---- */
  if((el=e.target.closest("[data-baixar-questionario]"))){

              : (portalDetalheRecord && portalDetalheRecord.id===bqId) ? portalDetalheRecord : null;
    if(!bqRec){ portalActionError="Não foi possível montar o questionário: solicitação não carregada."; render(); return; }

    baixarQuestionario(bqRec).catch(function(err){
      if(!(err && err.code==="declined")) portalActionError = "Não foi possível gerar o arquivo do questionário ("+((err&&(err.code||err.message))||"erro")+").";

  if((el=e.target.closest("[data-abrir-pub]"))){

      if(!(err && err.code==="declined")) portalActionError="Não foi possível gerar a página pública ("+((err&&(err.code||err.message))||"erro")+").";
      render();
    }).then(function(){ if(el){ el.disabled=false; el.textContent=rotPub; } });

  }
  if((el=e.target.closest("#btn-salvar-pub"))){
    var campoPub=document.getElementById("pub-url");
    var bruto=campoPub?campoPub.value:(state.pubUrlDraft||"");
    el.disabled=true;
    salvarUrlPublica(bruto).then(function(ok){ if(ok) state.pubUrlDraft=null; else state.pubUrlDraft=bruto; render(); });
    return;
  }
  if((el=e.target.closest("[data-abrir-importar]"))){ state.importarId=el.dataset.abrirImportar; state.importarErro=null; state.importarOk=null; render(); return; }
  if((el=e.target.closest("#btn-importar-cancelar"))){ state.importarId=null; state.importarErro=null; render(); return; }

  }
  /* ---- navegação lateral do painel do RH ---- */

  /* ---- cartões de indicador filtram a lista ---- */
  if((el=e.target.closest("[data-kpi]"))){
    var k = el.dataset.kpi;
    portalPainelPagina = 1;
    if(k==="all"){ portalPainelFilterStatus="all"; portalPainelFilterPrazo="all"; }
    else if(k==="__atrasadas"){ portalPainelFilterStatus="all"; portalPainelFilterPrazo="vencido"; }
    else { portalPainelFilterStatus=k; portalPainelFilterPrazo="all"; }

  if((el=e.target.closest("#btn-limpar-filtros"))){

    portalPainelFilterPrazo="all"; portalPainelFilterResp="all"; portalPainelPagina=1;

  if((el=e.target.closest("#btn-recarregar-painel"))){ startPainelSubscription(); render(); return; }
  if((el=e.target.closest("#btn-nova-solicitacao"))){ goNova(); return; }
  if((el=e.target.closest("#btn-nova-cancelar"))){ goPainel(); return; }

    if(!portalDb){ state.novaError="O banco de dados do portal não está disponível nesta sessão."; render(); return; }

      state.novaCriada=rec; state.novaError=null; state._novaForm={}; rememberNovaScreen(rec.id); render();
    }).catch(function(err){ state.novaError="Não foi possível criar a solicitação ("+(err&&err.code||"erro")+")."; render(); });
    return;

  if((el=e.target.closest("[data-copy-link]")) || (el=e.target.closest("#btn-copy-link"))){

    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(linkv).then(function(){flashL("Link copiado.");}).catch(function(){fallbackCopy(linkv,flashL);}); }

function fallbackCopy(text, flash){
  var ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); flash("Copiado."); } catch(e){ flash("Não foi possível copiar automaticamente — selecione o texto manualmente."); }
  document.body.removeChild(ta);
}
